# Production edge for VPS hosts where LiteSpeed already owns public 80/443.
# LiteSpeed terminates TLS and proxies only eduivme.com's vhost to this
# loopback listener. Existing sites and listeners remain untouched.
services:
  api-gateway:
    # LiteSpeed -> Caddy -> Gateway is the only public path. Do not expose the
    # Gateway's container port directly on the VPS host.
    ports: !reset []
    environment:
      ForwardedHeaders__ForwardLimit: "1"
      ForwardedHeaders__KnownProxies: ${FORWARDED_HEADERS_KNOWN_PROXIES:-172.31.0.10}
      ForwardedHeaders__KnownNetworks: ${FORWARDED_HEADERS_KNOWN_NETWORKS:-}

  production-edge:
    image: caddy:2.9.1-alpine
    ports:
      - "127.0.0.1:${PRODUCTION_EDGE_PORT:-5200}:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile.production.litespeed:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    depends_on:
      admin-panel:
        condition: service_healthy
      api-gateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      edu-network:
        ipv4_address: 172.31.0.10

volumes:
  production_caddy_data:
  production_caddy_config:

networks:
  edu-network:
    name: ${PRODUCTION_NETWORK_NAME:-eduplatform-production}
    driver: bridge
    ipam:
      config:
        - subnet: ${PRODUCTION_NETWORK_SUBNET:-172.31.0.0/16}
