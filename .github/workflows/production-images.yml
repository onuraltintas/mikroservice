name: Production images

# Decision 30.10.2026: production images are built here instead of on the 2-core server, whose admin-panel build
# reached 87% memory. Images are pushed to GHCR only for green CI runs on main and tagged with the 7-character commit
# id the server already uses as RELEASE_TAG. The server pulls them with infrastructure/scripts/pull-release-images.sh.
#
# Decision 16.11.2026: a merged pull request does not wait for the second CI run on main. The same checks already
# ran on the pull request; when the merge commit holds exactly the files that run checked (same tree as the pull
# request's head) the images are built right after the merge. Anything else (a direct push, a pull request that was
# behind main, a pull request without a green run) still waits for the CI run on main, as before.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["EduPlatform CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit id on main to build (defaults to the commit the run starts from)
        required: false

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: production-images-${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          # "checked" = the commit is a merge whose files are exactly those of a pull request head with a green CI run.
          checked=false
          sha="${RUN_SHA:-$GITHUB_SHA}"
          if [ "$EVENT" != "workflow_dispatch" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents[1].sha // empty' || true)
            if [ -n "$head" ]; then
              merged_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.tree.sha' || true)
              head_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq '.commit.tree.sha' || true)
              green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=50" \
                --jq '[.workflow_runs[] | select(.name == "EduPlatform CI")] | length' || echo 0)
              if [ -n "$merged_tree" ] && [ "$merged_tree" = "$head_tree" ] && [ "${green:-0}" -ge 1 ]; then checked=true; fi
            fi
          fi
          case "$EVENT" in
            workflow_dispatch) build=true ;;
            push) build=$checked ;;
            workflow_run)
              # The run after the merge already built a checked merge; build here only what it left out.
              if [ "$RUN_CONCLUSION" = "success" ] && [ "$RUN_EVENT" = "push" ] && [ "$checked" = "false" ]; then build=true; else build=false; fi ;;
            *) build=false ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT commit=$sha checked=$checked build=$build" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity-service, context: ., dockerfile: services/identity-service/Dockerfile }
          - { name: coaching-service, context: ., dockerfile: services/coaching-service/Dockerfile }
          - { name: speed-reading-service, context: ., dockerfile: services/speed-reading-service/Dockerfile }
          - { name: notification-service, context: ., dockerfile: services/notification-service/Dockerfile }
          - { name: billing-service, context: ., dockerfile: services/billing-service/Dockerfile }
          - { name: site-service, context: ., dockerfile: services/site-service/Dockerfile }
          - { name: api-gateway, context: ., dockerfile: services/api-gateway/Dockerfile }
          - { name: speed-reading-frontend, context: ./clients, dockerfile: speed-reading/Dockerfile }
          - { name: admin-panel, context: ./clients, dockerfile: admin-panel/Dockerfile }
          - { name: staff-portal, context: ./clients, dockerfile: admin-panel/Dockerfile.staff-portal }
    steps:
      - name: Resolve commit and tag
        id: meta
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          sha="${RUN_SHA:-${INPUT_REF:-$GITHUB_SHA}}"
          if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit id on main"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$sha" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/eduivme" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Refuse commits that are not on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ steps.meta.outputs.sha }}" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            RELEASE_TAG=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.repository }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  summary:
    name: Release tag summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write the release tag
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          sha="${RUN_SHA:-${INPUT_REF:-$GITHUB_SHA}}"
          tag=$(echo "$sha" | cut -c1-7)
          {
            echo "### Production images ready"
            echo "RELEASE_TAG=$tag (commit $sha)"
            echo "On the server: infrastructure/scripts/pull-release-images.sh $tag"
          } >> "$GITHUB_STEP_SUMMARY"
