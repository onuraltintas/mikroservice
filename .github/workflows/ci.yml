name: EduPlatform CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  source-safety:
    name: Source safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Compose contract tests
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Reject private keys and common cloud key formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- .; then
            echo "Potential credential material found in tracked files."
            exit 1
          fi
          if git ls-files -- '*.env' '*.env.*' '*.env.backup' | grep -Ev '(^|/).env.example$'; then
            echo "Tracked environment files are not allowed; use .env.example only."
            exit 1
          fi

      - name: Validate JSON and base Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if any(part in {'bin', 'obj', '.git'} for part in path.parts):
                  continue
              # Angular's tsconfig files are JSONC (they intentionally contain
              # comments); Angular's compiler validates them in its own build.
              if path.name.startswith('tsconfig'):
                  continue
              json.loads(path.read_text(encoding='utf-8-sig'))
          print('JSON configuration files are valid.')
          PY
          docker compose --env-file .env.example config --quiet

      - name: Verify protected product and hosting contracts
        run: |
          node --test tests/E2E/support/production-local-storage.contract.test.mjs
          node --test tests/E2E/support/staff-portal-hosting.contract.test.mjs
          node --test tests/E2E/support/non-root-runtime.contract.test.mjs
          node --test tests/E2E/course-management-foundation.contract.test.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: [source-safety]
    defaults:
      run:
        working-directory: clients/admin-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: clients/admin-panel/package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Fail on vulnerable npm packages
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        run: npm test -- --watch=false --progress=false

      - name: Run staff portal unit tests
        run: npm test -- --project staff-portal --watch=false --progress=false

      - name: Build browser and SSR bundles
        run: npm run build

      - name: Build the separate staff portal bundle
        run: npm run build -- --project staff-portal --configuration production --base-href /staff/

      - name: Build the separate Course Management student application
        run: |
          npm ci --prefix ../course-management
          npm audit --prefix ../course-management --audit-level=high
          npm run build --prefix ../course-management -- --configuration production

      - name: Install Course Management browser-smoke dependencies
        run: npm ci --prefix ../../tests/E2E

      - name: Install Chromium for Course Management panel smoke
        run: npx --prefix ../../tests/E2E playwright install --with-deps chromium

      - name: Verify Course Management student and staff panels
        run: node --test ../../tests/E2E/course-management-panels.smoke.test.mjs

  coaching-development-regression:
    name: Coaching development regression
    runs-on: ubuntu-latest
    needs: [source-safety]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: coaching_test
          POSTGRES_PASSWORD: coaching_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coaching_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COACHING_CURRICULUM_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=coaching_test;Password=coaching_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: clients/admin-panel/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install portal test dependencies
        run: npm ci --legacy-peer-deps
        working-directory: clients/admin-panel
      - name: Student and teacher tabs, notifications and six-exam recommendation matrix
        run: npm run test:coaching-development
        working-directory: clients/admin-panel
      - name: Recommendation, calendar conflict and record preservation regressions
        run: >-
          dotnet test tests/Integration/Coaching.Curriculum.IntegrationTests/Coaching.Curriculum.IntegrationTests.csproj
          --configuration Release --filter 'FullyQualifiedName~Practice|FullyQualifiedName~AssignmentInstructionPersistence|FullyQualifiedName~TeacherTracking|FullyQualifiedName~CoachingFollowUp|FullyQualifiedName~WeeklyReview|FullyQualifiedName~WeeklyFollowUp|FullyQualifiedName~WeeklyDecisionWork|FullyQualifiedName~StudentDailyAgenda'
          --logger 'trx;LogFileName=coaching-development.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coaching-development-test-results
          path: tests/Integration/Coaching.Curriculum.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore

  speed-reading-frontend:
    name: Speed Reading frontend checks
    runs-on: ubuntu-latest
    needs: [source-safety]
    defaults:
      run:
        working-directory: clients/speed-reading
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: clients/speed-reading/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Fail on vulnerable npm packages
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        # Karma: CI has no display, so the browser runs headless.
        run: npm test -- --watch=false --progress=false --browsers=ChromeHeadless

      - name: Verify Speed Reading template and backend contracts
        run: npm run test:contracts

      - name: Build standalone browser bundle
        run: npm run build -- --configuration production

  dotnet:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            project: services/identity-service/Identity.API/Identity.API.csproj
          - name: coaching
            project: services/coaching-service/Coaching.API/Coaching.API.csproj
          - name: notification
            project: services/notification-service/Notification.API/Notification.API.csproj
          - name: speed-reading
            project: services/speed-reading-service/SpeedReading.API/SpeedReading.API.csproj
          - name: course-management
            project: services/course-management-service/CourseManagement.API/CourseManagement.API.csproj
          - name: gateway
            project: services/api-gateway/EduPlatform.Gateway.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Build with warnings as errors
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore --warnaserror

  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [source-safety, dotnet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        run: dotnet restore tests/Integration/Identity.API.IntegrationTests/Identity.API.IntegrationTests.csproj

      - name: Run Docker-backed integration tests
        env:
          RUN_GATEWAY_HEALTH_TESTS: false
        run: >-
          dotnet test tests/Integration/Identity.API.IntegrationTests/Identity.API.IntegrationTests.csproj
          --configuration Release --no-restore --logger "trx;LogFileName=integration-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Check Coaching integration coverage regression floor
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/coverage -p 'test_*.py'
          coverage_file=$(find tests/Integration/Identity.API.IntegrationTests/TestResults -name coverage.cobertura.xml -print -quit)
          if [ -z "$coverage_file" ]; then
            echo "Cobertura report not found" >&2
            exit 1
          fi
          python tests/coverage/check_coaching_coverage.py "$coverage_file" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Speed Reading unit tests
        run: >-
          dotnet test tests/Unit/SpeedReading.Application.UnitTests/SpeedReading.Application.UnitTests.csproj
          --configuration Release --logger "trx;LogFileName=speed-reading-unit-tests.trx"

      - name: Run Course Management unit tests
        run: >-
          dotnet test tests/Unit/CourseManagement.Application.UnitTests/CourseManagement.Application.UnitTests.csproj
          --configuration Release --logger "trx;LogFileName=course-management-unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/Integration/Identity.API.IntegrationTests/TestResults/
            tests/Unit/SpeedReading.Application.UnitTests/TestResults/
            tests/Unit/CourseManagement.Application.UnitTests/TestResults/
          if-no-files-found: warn

  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-latest
    needs: [source-safety, dotnet]
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run gateway host, rate-limit and resilience tests
        env:
          GATEWAY_TEST_REDIS_HOST: 127.0.0.1
          GATEWAY_TEST_REDIS_PORT: 6379
        run: >-
          dotnet test tests/Unit/EduPlatform.Gateway.UnitTests/EduPlatform.Gateway.UnitTests.csproj
          --configuration Release --logger "trx;LogFileName=gateway-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: tests/Unit/EduPlatform.Gateway.UnitTests/TestResults/
          if-no-files-found: warn

  course-management-messaging-integration:
    name: Course Management RabbitMQ and PostgreSQL integration
    runs-on: ubuntu-latest
    needs: [source-safety, dotnet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Course Management integration test project
        run: dotnet restore tests/Integration/CourseManagement.IntegrationTests/CourseManagement.IntegrationTests.csproj --disable-parallel -m:1 -p:BuildInParallel=false

      - name: Run RabbitMQ and PostgreSQL end-to-end test
        run: >-
          dotnet test tests/Integration/CourseManagement.IntegrationTests/CourseManagement.IntegrationTests.csproj
          --configuration Release --no-restore --logger "trx;LogFileName=course-management-messaging.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-management-messaging-results
          path: tests/Integration/CourseManagement.IntegrationTests/TestResults/
          if-no-files-found: warn

  course-management-postgres-smoke:
    name: Course Management PostgreSQL migration and restore smoke
    runs-on: ubuntu-latest
    needs: [source-safety, dotnet]
    timeout-minutes: 25
    env:
      COURSE_MANAGEMENT_CONNECTION_STRING: Host=127.0.0.1;Database=course_management_ci;Username=course_management;Password=ci-course-management-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore and build Course Management API for the smoke test
        run: |
          dotnet restore services/course-management-service/CourseManagement.API/CourseManagement.API.csproj
          dotnet build services/course-management-service/CourseManagement.API/CourseManagement.API.csproj --configuration Debug --no-restore
          dotnet restore services/api-gateway/EduPlatform.Gateway.csproj
          dotnet build services/api-gateway/EduPlatform.Gateway.csproj --configuration Debug --no-restore

      - name: Install EF CLI for the Course Management migration artifact
        shell: bash
        run: dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 9.0.2

      - name: Generate idempotent Course Management migration SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/course-management
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations script \
            --idempotent \
            --no-build \
            --configuration Debug \
            --project services/course-management-service/CourseManagement.Infrastructure/CourseManagement.Infrastructure.csproj \
            --startup-project services/course-management-service/CourseManagement.Infrastructure/CourseManagement.Infrastructure.csproj \
            --output artifacts/course-management/course-management-idempotent.sql
          test -s artifacts/course-management/course-management-idempotent.sql
          grep -q '20261013085551_P0AccountErasure' artifacts/course-management/course-management-idempotent.sql
          grep -q '20261013144126_P0FailClosedLegalHoldStatus' artifacts/course-management/course-management-idempotent.sql
          grep -q '20261013155811_P6AttachmentCleanupRetryQueue' artifacts/course-management/course-management-idempotent.sql

      - name: Upload Course Management migration SQL for review
        uses: actions/upload-artifact@v4
        with:
          name: course-management-migrations-${{ github.run_id }}
          path: artifacts/course-management/course-management-idempotent.sql
          if-no-files-found: error
          retention-days: 30

      - name: Verify isolated PostgreSQL migrations, API, backup and restore
        shell: pwsh
        run: ./tests/E2E/course-management-migration.smoke.ps1

      - name: Verify pinned Course Management ClamAV upload scanning
        shell: pwsh
        run: ./tests/E2E/course-management-clamav.smoke.ps1

      - name: Verify Course Management OpenTelemetry delivery
        shell: pwsh
        run: ./tests/E2E/course-management-otel.smoke.ps1

  privacy-erasure-e2e:
    name: Distributed privacy erasure E2E
    runs-on: ubuntu-latest
    needs: [source-safety]
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: privacy-e2e-ci
      E2E_COMPOSE_ENV_FILE: .env.example
      E2E_DISPOSABLE_ENV: 'true'
      ENVIRONMENT: Development
      POSTGRES_USER: eduplatform
      POSTGRES_PASSWORD: ci-disposable-postgres-012345678901234567890123
      RABBITMQ_DEFAULT_USER: eduplatform
      RABBITMQ_DEFAULT_PASS: ci-disposable-rabbit-012345678901234567890123
      REDIS_PASSWORD: ci-disposable-redis-012345678901234567890123
      COURSE_MANAGEMENT_DB_PASSWORD: ci-disposable-course-db-012345678901234567890123
      E2E_COURSE_MANAGEMENT_ENABLED: 'true'
      SPEED_READING_OWNED_CONNECTION_STRING: Host=postgres;Port=5432;Database=speedreading_owned_db;Username=eduplatform;Password=ci-disposable-postgres-012345678901234567890123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Start disposable service stack
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml
          --profile speed-reading up -d --build postgres redis rabbitmq identity-service coaching-service
          notification-service speed-reading-service api-gateway course-management-db

      - name: Migrate and start Course Management
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml build course-management-service
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml run --rm --no-deps course-management-service --migrate-only
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml up -d course-management-service

      - name: Verify distributed erasure and Coaching restore
        run: node --test tests/E2E/support/privacy-docker.test.mjs tests/E2E/privacy-erasure.docker.test.mjs tests/E2E/coaching-backup-restore.docker.test.mjs tests/E2E/coaching-data-export-route.contract.test.mjs

      - name: Verify Coaching export and dependency outage recovery
        run: node --test tests/E2E/coaching-data-export.docker.test.mjs

      - name: Verify durable Coaching event delivery after broker restart
        run: node --test tests/E2E/coaching-broker-recovery.docker.test.mjs

      - name: Verify Coaching attachment upload, read and student isolation
        run: node --test tests/E2E/coaching-attachment.docker.test.mjs

      - name: Verify Coaching institution admin and teacher tenant isolation
        run: node --test tests/E2E/coaching-admin-tenant.docker.test.mjs

      - name: Preserve service logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml --profile speed-reading logs --no-color --tail 100 identity-service coaching-service notification-service speed-reading-service api-gateway course-management-service course-management-db

      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml --profile speed-reading down -v --remove-orphans

  migration-drift:
    name: EF migration drift
    runs-on: ubuntu-latest
    needs: [source-safety]
    env:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_PASSWORD: ci-postgres-password-012345678901234567890123
      POSTGRES_HOST: localhost
      POSTGRES_USER: eduplatform
      POSTGRES_DB_IDENTITY: identity_db
      POSTGRES_DB_COACHING: coaching_db
      POSTGRES_DB_NOTIFICATION: notification_db
      COURSE_MANAGEMENT_CONNECTION_STRING: Host=127.0.0.1;Database=course_management_ci;Username=course_management;Password=ci-course-management-only
      INTERNAL_SERVICE_API_KEY: ci-internal-service-key-012345678901234567890123
      JWT_SECRET: ci-jwt-secret-012345678901234567890123456789
      JWT_ISSUER: eduplatform.identity
      JWT_AUDIENCE: eduplatform.api
      JWT_KEY_ID: ci
      RABBITMQ_DEFAULT_USER: ci
      RABBITMQ_DEFAULT_PASS: ci-rabbit-password-012345678901234567
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF CLI
        shell: bash
        run: dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 9.0.2

      - name: Restore application projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore services/identity-service/Identity.API/Identity.API.csproj
          dotnet restore services/coaching-service/Coaching.API/Coaching.API.csproj
          dotnet restore services/notification-service/Notification.API/Notification.API.csproj
          dotnet restore services/speed-reading-service/SpeedReading.API/SpeedReading.API.csproj
          dotnet restore services/course-management-service/CourseManagement.API/CourseManagement.API.csproj

      - name: Fail when EF models have unapplied changes
        shell: bash
        run: |
          set -euo pipefail
          ef="$RUNNER_TEMP/dotnet-tools/dotnet-ef"
          "$ef" migrations has-pending-model-changes \
            --project services/identity-service/Identity.Infrastructure/Identity.Infrastructure.csproj \
            --startup-project services/identity-service/Identity.API/Identity.API.csproj \
            --configuration Release
          "$ef" migrations has-pending-model-changes \
            --project services/coaching-service/Coaching.Infrastructure/Coaching.Infrastructure.csproj \
            --startup-project services/coaching-service/Coaching.API/Coaching.API.csproj \
            --configuration Release
          "$ef" migrations has-pending-model-changes \
            --project services/notification-service/Notification.Infrastructure/Notification.Infrastructure.csproj \
            --startup-project services/notification-service/Notification.API/Notification.API.csproj \
            --configuration Release
          "$ef" migrations has-pending-model-changes \
            --project services/speed-reading-service/SpeedReading.Infrastructure/SpeedReading.Infrastructure.csproj \
            --startup-project services/speed-reading-service/SpeedReading.API/SpeedReading.API.csproj \
            --context OwnedSpeedReadingDbContext \
            --configuration Release
          "$ef" migrations has-pending-model-changes \
            --project services/course-management-service/CourseManagement.Infrastructure/CourseManagement.Infrastructure.csproj \
            --startup-project services/course-management-service/CourseManagement.Infrastructure/CourseManagement.Infrastructure.csproj \
            --configuration Release

  gateway-smoke:
    name: Gateway health smoke
    runs-on: ubuntu-latest
    needs: [source-safety, dotnet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build Gateway
        run: |
          dotnet restore services/api-gateway/EduPlatform.Gateway.csproj
          dotnet build services/api-gateway/EduPlatform.Gateway.csproj --configuration Release --no-restore --warnaserror

      - name: Restore smoke test project
        run: dotnet restore tests/Integration/Identity.API.IntegrationTests/Identity.API.IntegrationTests.csproj

      - name: Start Gateway
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          ENVIRONMENT: Development
          JWT_SECRET: ci-gateway-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          JWT_ISSUER: eduplatform.identity
          JWT_AUDIENCE: eduplatform.api
          JWT_KEY_ID: ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ci-redis-password-012345678901234567
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project services/api-gateway/EduPlatform.Gateway.csproj \
            --configuration Release --no-build --no-restore > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          echo "$gateway_pid" > "$RUNNER_TEMP/gateway.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gateway.log"
          exit 1

      - name: Run Gateway health tests
        env:
          RUN_GATEWAY_HEALTH_TESTS: true
        run: >-
          dotnet test tests/Integration/Identity.API.IntegrationTests/Identity.API.IntegrationTests.csproj
          --configuration Release --no-restore
          --filter FullyQualifiedName~HealthCheckTests

      - name: Stop Gateway
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gateway.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gateway.pid")" || true
          fi
          if [[ -f "$RUNNER_TEMP/gateway.log" ]]; then
            cat "$RUNNER_TEMP/gateway.log"
          fi

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    needs: [source-safety]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for storage preflight
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Validate development and scale configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile speed-reading config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.scale.yml config --quiet

      - name: Validate the optional Course Management development overlay
        env:
          COURSE_MANAGEMENT_DB_PASSWORD: ci-course-management-only
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.course-management.yml config --quiet

      - name: Validate staging VPS configuration
        env:
          SPEED_READING_CONNECTION_STRING: 'Host=ci-speed-reading;Port=5432;Database=speedreading;Username=ci;Password=ci-only'
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            --profile security-scan config --quiet

      - name: Validate production and observability overlays
        env:
          COURSE_MANAGEMENT_ALLOWED_HOSTS: course-management-service
          COURSE_MANAGEMENT_CONNECTION_STRING: 'Host=postgres;Port=5432;Database=course_management_ci;Username=ci;Password=ci-only'
          COURSE_MANAGEMENT_OTLP_ENDPOINT: https://otel-ci.invalid:4317
          DATAPROTECTION_CERTIFICATE_HOST_PATH: ${{ runner.temp }}/dataprotection-ci.pfx
          DATAPROTECTION_CERTIFICATE_PASSWORD: ci-config-only
          GRAFANA_ADMIN_PASSWORD: ci-config-only
          RELEASE_TAG: ci
          SMTP_HOST: smtp-ci.invalid
          SMTP_PORT: 25
          SMTP_FROM_EMAIL: ci@example.invalid
          SMTP_USERNAME: ci-only
          SMTP_PASSWORD: ci-only
          SPEED_READING_CONNECTION_STRING: 'Host=ci-speed-reading;Port=5432;Database=speedreading;Username=ci;Password=ci-only'
        run: |
          node --test tests/E2E/support/coaching-storage-preflight.test.mjs
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f docker-compose.observability.yml \
            config --format json |
            node -e 'const config=JSON.parse(require("fs").readFileSync(0,"utf8")); if (config.services["course-management-service"]) throw new Error("The shared observability overlay must not enable Course Management.");'
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            config --format json | node tools/coaching-storage-preflight.mjs
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f docker-compose.course-management.production.yml config --format json |
            node -e 'const config=JSON.parse(require("fs").readFileSync(0,"utf8")); const env=config.services["course-management-service"]?.environment; if (env?.OTEL_EXPORTER_OTLP_ENDPOINT!=="https://otel-ci.invalid:4317" || env?.OTEL_SERVICE_NAME!=="EduPlatform.CourseManagement") throw new Error("Course Management OTLP environment was not applied.");'
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f docker-compose.course-management.production.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.course-management.observability.yml config --format json |
            node -e 'const config=JSON.parse(require("fs").readFileSync(0,"utf8")); const env=config.services["course-management-service"]?.environment; if (env?.OTEL_EXPORTER_OTLP_ENDPOINT!=="http://otel-collector:4317" || env?.OTEL_SERVICE_NAME!=="EduPlatform.CourseManagement") throw new Error("Course Management OTLP environment was not merged.");'

      - name: Validate monitoring configuration files
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check rules /etc/prometheus/rules/eduplatform.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/course-management-alerts.test.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/gateway-alerts.test.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/monitoring/otel:/etc/otelcol-contrib:ro" \
            otel/opentelemetry-collector-contrib:0.133.0 \
            validate --config=/etc/otelcol-contrib/otel-collector.yml
          docker run --rm \
            -v "$PWD/monitoring/tempo:/etc/tempo:ro" \
            grafana/tempo:2.8.2 \
            --config.file=/etc/tempo/tempo.yml --config.verify=true
          docker run --rm \
            -v "$PWD/monitoring/blackbox:/etc/blackbox:ro" \
            prom/blackbox-exporter:v0.27.0 \
            --config.file=/etc/blackbox/blackbox.yml --config.check

  vulnerabilities:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    needs: [source-safety]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore all application projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find services shared -name '*.csproj' -print)

      - name: Fail on vulnerable NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            services/identity-service/Identity.API/Identity.API.csproj
            services/coaching-service/Coaching.API/Coaching.API.csproj
            services/notification-service/Notification.API/Notification.API.csproj
            services/speed-reading-service/SpeedReading.API/SpeedReading.API.csproj
            services/course-management-service/CourseManagement.API/CourseManagement.API.csproj
            services/api-gateway/EduPlatform.Gateway.csproj
          )
          for project in "${projects[@]}"; do
            report="${RUNNER_TEMP}/$(basename "$project").json"
            dotnet list "$project" package --vulnerable --include-transitive --format json > "$report"
            vulnerable=$(jq '[.projects[].frameworks[]?.topLevelPackages[]?, .projects[].frameworks[]?.transitivePackages[]? | select((.vulnerabilities // []) | length > 0)] | length' "$report")
            if [[ "$vulnerable" != "0" ]]; then
              cat "$report"
              echo "Vulnerable NuGet packages found in $project."
              exit 1
            fi
          done

  container-build:
    name: Container build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [dotnet, tests, course-management-postgres-smoke, privacy-erasure-e2e, migration-drift, gateway-smoke, compose, vulnerabilities, frontend, speed-reading-frontend, coaching-development-regression]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            context: .
            dockerfile: services/identity-service/Dockerfile
          - name: coaching
            context: .
            dockerfile: services/coaching-service/Dockerfile
          - name: notification
            context: .
            dockerfile: services/notification-service/Dockerfile
          - name: speed-reading
            context: .
            dockerfile: services/speed-reading-service/Dockerfile
          - name: course-management
            context: .
            dockerfile: services/course-management-service/Dockerfile
          - name: gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: admin-panel
            context: clients
            dockerfile: clients/admin-panel/Dockerfile
          - name: speed-reading-frontend
            context: clients
            dockerfile: clients/speed-reading/Dockerfile
          - name: staff-portal
            context: clients
            dockerfile: clients/admin-panel/Dockerfile.staff-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: eduplatform-ci-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
