name: EduPlatform E2E

on:
  workflow_dispatch:
    inputs:
      run_ui:
        description: 'Run the browser admin-panel journey against E2E_UI_BASE_URL'
        required: false
        default: false
        type: boolean
      run_support_write:
        description: 'Run the support idempotency write check against a disposable staging environment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eduplatform-e2e-staging
  cancel-in-progress: false

jobs:
  critical-flows:
    name: Playwright critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      E2E_UI_BASE_URL: ${{ secrets.E2E_UI_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_REQUIRED: 'true'
      E2E_RUN_UI: ${{ inputs.run_ui }}
      E2E_RUN_SUPPORT_WRITE: ${{ inputs.run_support_write }}
      E2E_DISPOSABLE_ENV: ${{ vars.E2E_DISPOSABLE_ENV }}
      E2E_START_UI: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_API_BASE_URL" || { echo 'E2E_API_BASE_URL is missing.'; exit 1; }
          test -n "$E2E_ADMIN_EMAIL" || { echo 'E2E_ADMIN_EMAIL is missing.'; exit 1; }
          test -n "$E2E_ADMIN_PASSWORD" || { echo 'E2E_ADMIN_PASSWORD is missing.'; exit 1; }
          if [[ "$E2E_RUN_UI" == "true" ]]; then
            test -n "$E2E_UI_BASE_URL" || { echo 'E2E_UI_BASE_URL is required when run_ui=true.'; exit 1; }
          fi
          if [[ "$E2E_RUN_SUPPORT_WRITE" == "true" ]]; then
            test "$E2E_DISPOSABLE_ENV" = 'true' || {
              echo 'run_support_write=true requires staging variable E2E_DISPOSABLE_ENV=true.'
              exit 1
            }
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: tests/E2E/package-lock.json

      - name: Install locked E2E dependencies
        run: npm ci --prefix tests/E2E

      - name: Install Chromium
        run: npx --prefix tests/E2E playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test --prefix tests/E2E

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            tests/E2E/playwright-report/
            tests/E2E/playwright-results.xml
          if-no-files-found: warn
          retention-days: 14
