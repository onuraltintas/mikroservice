    <script>
        (function(){
          const summary = document.getElementById('resultSummary');
          const wordSearch = document.getElementById('wordSearch');
          let dt = null;
          let searchTimer = null;

          const KADEME_LABELS = {
            0: 'Okul öncesi',
            1: 'İlkokul',
            2: 'Ortaokul',
            4: 'Lise'
          };

          const RM_DT_LANGUAGE = {
            emptyTable: 'Kayıt bulunamadı',
            info: '_TOTAL_ kayıttan _START_–_END_ arası gösteriliyor',
            infoEmpty: 'Kayıt yok',
            infoFiltered: '(_MAX_ kayıt içinden filtrelendi)',
            lengthMenu: '_MENU_ kayıt göster',
            loadingRecords: 'Yükleniyor...',
            processing: 'Yükleniyor...',
            search: 'Ara:',
            zeroRecords: 'Eşleşen kayıt bulunamadı',
            paginate: { first: 'İlk', last: 'Son', next: 'Sonraki', previous: 'Önceki' }
          };

          function escapeHtml(s){
            return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
              .replaceAll('"','&quot;').replaceAll("'",'&#39;');
          }

          const titleCaseTr = (s) => (window.RmTitleCaseTr ? window.RmTitleCaseTr(s) : String(s ?? ''));
          function displayText(v){
            return escapeHtml(titleCaseTr(v));
          }

          function kademeLabel(v){
            const n = Number(v);
            return titleCaseTr(KADEME_LABELS[n] || '—');
          }

          function kurumCellHtml(row){
            const kk = row.kurumKodu ?? row.KurumKodu;
            const ad = row.kurumAdi ?? row.KurumAdi ?? '';
            if(window.RmKurumLink?.kurumCellHtml){
              return RmKurumLink.kurumCellHtml(kk, ad, escapeHtml);
            }
            return `<div class="rm-kurum-cell"><span class="rm-kurum-name">${displayText(ad)}</span></div>`;
          }

          function initDataTable(){
            if(dt){ dt.destroy(); dt = null; }
            dt = $('#myTable').DataTable({
              processing: true,
              serverSide: true,
              searching: false,
              ordering: false,
              autoWidth: false,
              pageLength: 50,
              lengthMenu: [[25, 50, 100], [25, 50, 100]],
              dom: '<"row align-items-center mb-2"<"col-sm-6"l>>rt<"row align-items-center mt-2"<"col-sm-6"i><"col-sm-6"p>>',
              language: RM_DT_LANGUAGE,
              ajax: function(data, callback){
                const params = new URLSearchParams();
                params.set('page', String(Math.floor(data.start / data.length) + 1));
                params.set('pageSize', String(data.length));
                const q = (wordSearch?.value || '').trim();
                if(q) params.set('q', q);
                fetch('/api/tumOkullar/arama?' + params.toString())
                  .then(r => { if(!r.ok) throw new Error('Arama başarısız'); return r.json(); })
                  .then(json => {
                    const items = json.items || [];
                    const total = json.total || 0;
                    summary.textContent = total ? `${total.toLocaleString('tr-TR')} okul kaydı` : 'Kayıt bulunamadı';
                    callback({
                      draw: data.draw,
                      recordsTotal: total,
                      recordsFiltered: total,
                      data: items.map(row => [
                        displayText(row.ilAdi ?? row.IlAdi ?? ''),
                        displayText(row.ilceAdi ?? row.IlceAdi ?? ''),
                        kurumCellHtml(row),
                        displayText(row.kurumTuruAdi ?? row.KurumTuruAdi ?? '—'),
                        escapeHtml(kademeLabel(row.kademe ?? row.Kademe))
                      ])
                    });
                  })
                  .catch(err => {
                    console.error(err);
                    summary.textContent = 'Arama sırasında bir sorun oluştu.';
                    callback({ draw: data.draw, recordsTotal: 0, recordsFiltered: 0, data: [] });
                  });
              },
              drawCallback: function(){
                const labels = ['İl', 'İlçe', 'Kurum Adı', 'Kurum Türü', 'Kademe'];
                this.api().rows().every(function(){
                  $(this.node()).find('td').each(function(i){
                    this.setAttribute('data-label', labels[i] || '');
                    if(window.innerWidth <= 768){
                      this.style.minWidth = '';
                      this.style.width = '';
                    }
                  });
                });
                if(window.innerWidth <= 768){
                  const tbl = document.getElementById('myTable');
                  if(tbl){
                    tbl.style.width = '100%';
                    tbl.style.minWidth = '0';
                  }
                }
                if(window.RmKurumLink?.bindTableLinks){
                  RmKurumLink.bindTableLinks(document.getElementById('myTable'));
                }
                window.RmStickyTableHead?.refresh(document.querySelector('.rm-table-wrap'));
              }
            });
          }

          wordSearch?.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
              if(dt) dt.ajax.reload(null, false);
            }, 300);
          });

          initDataTable();
        })();
    </script>
