global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # OpenTelemetry Collector exports application and runtime metrics here.
  - job_name: eduplatform-otel
    static_configs:
      - targets: [otel-collector:9464]

  # RabbitMQ's native Prometheus endpoint remains internal to the network.
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  # Health is probed as availability, not mixed into application latency
  # histograms. The blackbox exporter keeps readiness failures visible even
  # when an application has not emitted any telemetry yet.
  - job_name: eduplatform-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:8080/health
          - http://identity-service:8080/health/ready
          - http://coaching-service:8080/health/ready
          - http://notification-service:8080/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
