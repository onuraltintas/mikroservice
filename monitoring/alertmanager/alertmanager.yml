global:
  resolve_timeout: 5m

route:
  group_by: [alertname, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    # Configure an SMTP/webhook receiver through the deployment secret manager
    # before relying on external notifications. Alerts remain visible in the
    # Alertmanager UI until a receiver is configured.
