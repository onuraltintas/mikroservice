# Production overlay. This file intentionally forces the application services
# into Production mode. Provide DATAPROTECTION_CERTIFICATE_HOST_PATH,
# AUTH_RECAPTCHA_SECRET_HOST_PATH and DATAPROTECTION_CERTIFICATE_PASSWORD through
# the deployment secret manager, and replace the development SMTP values with a
# real SMTP provider.
# The certificate file is intentionally not stored in this repository.
secrets:
  dataprotection_certificate:
    file: ${DATAPROTECTION_CERTIFICATE_HOST_PATH:?DATAPROTECTION_CERTIFICATE_HOST_PATH must point to the production PFX/PKCS12 file}
  auth_recaptcha_secret:
    file: ${AUTH_RECAPTCHA_SECRET_HOST_PATH:-/opt/eduivme/secrets/auth-recaptcha-secret}

services:
  # Internal infrastructure is reachable only over the Compose network in
  # production. The Gateway is the only public application entry point.
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    ports: !reset []
    restart: unless-stopped

  mailcatcher:
    profiles: ["development"]
    ports: !reset []

  clamav:
    # Attachment malware scanning is required by the production coaching
    # service; remove the development-only profile in this overlay.
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  identity-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/identity-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AuthRecaptcha__Enabled: ${AUTH_RECAPTCHA_ENABLED:?AUTH_RECAPTCHA_ENABLED must be explicitly set to true or false}
      AuthRecaptcha__SiteKey: ${AUTH_RECAPTCHA_SITE_KEY:-}
      AuthRecaptcha__SecretKeyFile: /run/secrets/auth-recaptcha-secret
      AuthRecaptcha__MinimumScore: ${AUTH_RECAPTCHA_MINIMUM_SCORE:-0.5}
      AuthRecaptcha__AllowedHostnames__0: ${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_0:-}
      AuthRecaptcha__AllowedHostnames__1: ${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_1:-}
      AuthRecaptcha__AllowedHostnames__2: ${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_2:-}
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      identity-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
      - source: auth_recaptcha_secret
        target: auth-recaptcha-secret
    restart: unless-stopped

  identity-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/identity-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  coaching-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/coaching-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      COACHING_NEWSLETTER_RECAPTCHA_ENABLED: ${COACHING_NEWSLETTER_RECAPTCHA_ENABLED:-false}
      COACHING_NEWSLETTER_RECAPTCHA_SITE_KEY: ${COACHING_NEWSLETTER_RECAPTCHA_SITE_KEY:-}
      COACHING_NEWSLETTER_RECAPTCHA_SECRET_KEY: ${COACHING_NEWSLETTER_RECAPTCHA_SECRET_KEY:-}
      COACHING_NEWSLETTER_RECAPTCHA_MINIMUM_SCORE: ${COACHING_NEWSLETTER_RECAPTCHA_MINIMUM_SCORE:-0.5}
      COACHING_NEWSLETTER_RECAPTCHA_ALLOWED_HOSTNAMES: ${COACHING_NEWSLETTER_RECAPTCHA_ALLOWED_HOSTNAMES:-}
      Coaching__Attachments__Provider: Local
      Coaching__Attachments__Scanner__Provider: ClamAv
      Coaching__CmsMedia__RootPath: /var/lib/eduplatform/coaching-cms-media
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      coaching-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    volumes:
      - coaching_cms_media:/var/lib/eduplatform/coaching-cms-media
    restart: unless-stopped

  # Apply the Coaching schema once before web replicas start. The command
  # exits after EF migrations and never starts RabbitMQ consumers or HTTP.
  coaching-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/coaching-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Coaching__Attachments__Provider: Local
      Coaching__Attachments__RootPath: /var/lib/eduplatform/attachments
      Coaching__Attachments__Scanner__Provider: ClamAv
      Coaching__CmsMedia__RootPath: /var/lib/eduplatform/coaching-cms-media
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-service:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    # Replace the base service environment completely. The web runtime must
    # never receive the legacy source connection after the owned cutover.
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
      SpeedReading__Mode: ${SPEED_READING_MODE:-Standalone}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set for speed-reading}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set for speed-reading}
      SpeedReading__CoachingIntegrationEnabled: ${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      SpeedReading__NotificationIntegrationEnabled: ${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      SpeedReading__SubscriptionIntegrationEnabled: ${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GOOGLE_RECAPTCHA_ENABLED: ${GOOGLE_RECAPTCHA_ENABLED:-false}
      GOOGLE_RECAPTCHA_SITE_KEY: ${GOOGLE_RECAPTCHA_SITE_KEY:-}
      GOOGLE_RECAPTCHA_SECRET_KEY: ${GOOGLE_RECAPTCHA_SECRET_KEY:-}
      GOOGLE_RECAPTCHA_MINIMUM_SCORE: ${GOOGLE_RECAPTCHA_MINIMUM_SCORE:-0.5}
      GOOGLE_RECAPTCHA_ALLOWED_HOSTNAMES: ${GOOGLE_RECAPTCHA_ALLOWED_HOSTNAMES:-}
      PublicApp__BaseUrl: ${SPEED_READING_PUBLIC_BASE_URL:-https://masterhizliokuma.com}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      JWT_PREVIOUS_KEY_IDS: ${JWT_PREVIOUS_KEY_IDS:-}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set for speed-reading}
      Services__IdentityService: http://identity-service:8080
      Services__NotificationService: http://notification-service:8080
      SpeedReading__CmsMedia__RootPath: /var/lib/eduplatform/media
      DataProtection__KeysPath: /var/lib/eduplatform/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    volumes:
      - speed_reading_data_protection:/var/lib/eduplatform/data-protection-keys
      - speed_reading_media:/var/lib/eduplatform/media
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    restart: unless-stopped
    depends_on:
      speed-reading-migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_started
    networks:
      - edu-network

  speed-reading-migrations:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-frontend:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-frontend:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: ./clients
      dockerfile: speed-reading/Dockerfile
    environment:
      NODE_ENV: production
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  notification-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/notification-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Notification links are selected by recipient role: speed-reading
      # roles use SPEED_READING_PUBLIC_BASE_URL; central roles use PUBLIC_APP_BASE_URL.
      PublicApp__BaseUrl: ${PUBLIC_APP_BASE_URL:-https://eduivme.com}
      PublicApp__SpeedReadingBaseUrl: ${SPEED_READING_PUBLIC_BASE_URL:-https://masterhizliokuma.com}
      Email__Host: ${SMTP_HOST:?SMTP_HOST must be set to a production SMTP host}
      Email__Port: ${SMTP_PORT:?SMTP_PORT must be set to a production SMTP port}
      Email__From: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}
      Email__Username: ${SMTP_USERNAME:?SMTP_USERNAME must be set for production SMTP}
      Email__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set for production SMTP}
      Email__FromName: ${SMTP_FROM_NAME:-Eduİvme}
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    restart: unless-stopped

  notification-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/notification-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  api-gateway:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/api-gateway:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    depends_on:
      speed-reading-service:
        condition: service_started
    restart: unless-stopped

  # The Angular SSR application remains private; the dedicated LiteSpeed
  # overlay publishes it through production-edge on loopback only.
  admin-panel:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/admin-panel:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: ./clients
      dockerfile: admin-panel/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  # Staff portal is a separate SPA image. Caddy publishes it only below
  # onuraltintas.net/staff while the existing student and admin portals stay put.
  staff-portal:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/staff-portal:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: ./clients
      dockerfile: admin-panel/Dockerfile.staff-portal
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

volumes:
  production_caddy_data:
  production_caddy_config:
  coaching_cms_media:

networks:
  edu-network:
    name: ${PRODUCTION_NETWORK_NAME:-eduplatform-production}
    driver: bridge
    ipam:
      config:
        - subnet: ${PRODUCTION_NETWORK_SUBNET:-172.31.0.0/16}
