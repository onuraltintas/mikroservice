# Production overlay. This file intentionally forces the application services
# into Production mode. Provide DATAPROTECTION_CERTIFICATE_HOST_PATH and
# DATAPROTECTION_CERTIFICATE_PASSWORD through the deployment secret manager,
# and replace the development SMTP values with a real SMTP provider.
# The certificate file is intentionally not stored in this repository.
secrets:
  dataprotection_certificate:
    file: ${DATAPROTECTION_CERTIFICATE_HOST_PATH:?DATAPROTECTION_CERTIFICATE_HOST_PATH must point to the production PFX/PKCS12 file}

services:
  # Internal infrastructure is reachable only over the Compose network in
  # production. The Gateway is the only public application entry point.
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  mailcatcher:
    profiles: ["development"]
    ports: !reset []

  clamav:
    # Attachment malware scanning is required by the production coaching
    # service; remove the development-only profile in this overlay.
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  minio:
    # Coaching attachments use the OSS S3-compatible object store in
    # production; remove the optional development profile in this overlay.
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/identity-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      identity-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx

  identity-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/identity-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  coaching-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/coaching-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      coaching-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx

  # Apply the Coaching schema once before web replicas start. The command
  # exits after EF migrations and never starts RabbitMQ consumers or HTTP.
  coaching-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/coaching-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-service:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    # Replace the base service environment completely. The web runtime must
    # never receive the legacy source connection after the owned cutover.
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
      SpeedReading__OwnedDataEnabled: "true"
      SpeedReading__Mode: ${SPEED_READING_MODE:-Standalone}
      SpeedReading__CoachingIntegrationEnabled: ${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      SpeedReading__NotificationIntegrationEnabled: ${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      SpeedReading__SubscriptionIntegrationEnabled: ${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      JWT_PREVIOUS_KEY_IDS: ${JWT_PREVIOUS_KEY_IDS:-}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set for speed-reading}
      Services__IdentityService: http://identity-service:8080
      Services__NotificationService: http://notification-service:8080
      DataProtection__KeysPath: /var/lib/eduplatform/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    volumes:
      - speed_reading_data_protection:/var/lib/eduplatform/data-protection-keys
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    restart: unless-stopped
    depends_on:
      speed-reading-migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_started
    networks:
      - edu-network

  speed-reading-migrations:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
      SpeedReading__OwnedDataEnabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-frontend:
    profiles: !reset []
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/speed-reading-frontend:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: ./clients/speed-reading
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  notification-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/notification-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Email__Host: ${SMTP_HOST:?SMTP_HOST must be set to a production SMTP host}
      Email__Port: ${SMTP_PORT:?SMTP_PORT must be set to a production SMTP port}
      Email__From: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}
      Email__Username: ${SMTP_USERNAME:?SMTP_USERNAME must be set for production SMTP}
      Email__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set for production SMTP}
      Email__FromName: ${SMTP_FROM_NAME:-Eduİvme}
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx

  notification-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/notification-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  api-gateway:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/api-gateway:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__CertificatePath: /run/secrets/eduplatform-dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:?DATAPROTECTION_CERTIFICATE_PASSWORD must be set}
    secrets:
      - source: dataprotection_certificate
        target: eduplatform-dataprotection.pfx
    depends_on:
      speed-reading-service:
        condition: service_started

  # The Angular SSR application remains private; the dedicated LiteSpeed
  # overlay publishes it through production-edge on loopback only.
  admin-panel:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/admin-panel:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: ./clients/admin-panel
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

volumes:
  production_caddy_data:
  production_caddy_config:
