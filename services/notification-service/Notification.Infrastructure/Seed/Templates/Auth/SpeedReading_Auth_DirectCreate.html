<!doctype html>
<html lang="tr">
  <body style="margin:0;background:#f5f7ff;color:#172033;font-family:Arial,sans-serif;line-height:1.6">

      <div style="font-size:24px;font-weight:700;color:#4f46e5">Master Hızlı Okuma</div>
      <p>Merhaba {{FirstName}} {{LastName}},</p>

      <p style="text-align:center;margin:28px 0">
        <a href="{{PasswordSetupUrl}}" style="display:inline-block;padding:13px 24px;background:#4f46e5;color:#fff;border-radius:9px;text-decoration:none;font-weight:700">Şifremi belirle</a>
      </p>
      <p style="font-size:13px;color:#667085">Hesap e-postası: {{Email}}</p>
