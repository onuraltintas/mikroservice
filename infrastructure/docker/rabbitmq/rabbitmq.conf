# This deployment is a single RabbitMQ node. Keep its identity stable across
# container recreation so the durable data directory is reused.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq

# RabbitMQ 4.x deprecates the management UI's legacy metrics collector.
# The Prometheus plugin remains enabled and is the production metrics source.
management_agent.disable_metrics_collector = true

# The legacy management collector emits an expected default-category warning
# when disabled. Keep actionable broker errors visible while sending routine
# metrics to Prometheus instead of duplicating them in container logs.
log.default.level = error
