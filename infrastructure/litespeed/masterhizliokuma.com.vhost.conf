# Dedicated standalone Hızlı Okuma vhost. Do not modify other site vhosts.
docRoot                   /home/masterhizliokuma.com/public_html
vhDomain                  masterhizliokuma.com
vhAliases                 www.masterhizliokuma.com
adminEmails               iletisim@masterhizliokuma.com
enableGzip                1
enableIpGeo               1

index  {
  useServer               0
  indexFiles              index.html
}

extprocessor masterhizliokuma_speed_reading_edge {
  type                    proxy
  address                 127.0.0.1:5201
  maxConns                200
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

rewrite  {
  enable                  1
  RewriteCond             %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteCond             %{HTTPS} off
  RewriteRule             ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  autoLoadHtaccess        0
}

context /.well-known/acme-challenge {
  location                /home/masterhizliokuma.com/public_html/.well-known/acme-challenge
  allowBrowse             1
  rewrite  {
    enable                0
  }
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 masterhizliokuma_speed_reading_edge
  addDefaultCharset       off
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/masterhizliokuma.com/privkey.pem
  certFile                /etc/letsencrypt/live/masterhizliokuma.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling           1
  ocspRespMaxAge           86400
}
