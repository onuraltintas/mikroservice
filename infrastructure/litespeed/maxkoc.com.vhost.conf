# LiteSpeed vhost for maxkoc.com (alan adı planı 18.11.2026): Koçluk students, and parents on veli.maxkoc.com.
# The root domain is intentionally isolated to this vhost; existing VPS sites
# keep their own listener mappings and document roots.
docRoot                   /home/maxkoc.com/public_html
vhDomain                  maxkoc.com
vhAliases                 www.maxkoc.com, veli.maxkoc.com
adminEmails               onuraltintas@gmail.com
enableGzip                1
enableIpGeo               1

index  {
  useServer               0
  indexFiles              index.html
}

errorlog /home/maxkoc.com/logs/maxkoc.com.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/maxkoc.com/logs/maxkoc.com.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

extprocessor eduivme_production_edge {
  type                    proxy
  address                 127.0.0.1:5200
  maxConns                200
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

context / {
  type                    proxy
  handler                 eduivme_production_edge
  addDefaultCharset       off
}

context /hubs/notifications/negotiate {
  type                    proxy
  handler                 eduivme_production_edge
  addDefaultCharset       off
}

# Server-Sent Events and Long Polling use the hub root over regular HTTP. Without this
# context the websocket directive below claims the path and LiteSpeed answers 404.
context /hubs/notifications {
  type                    proxy
  handler                 eduivme_production_edge
  addDefaultCharset       off
}

websocket /hubs/notifications {
  address                 127.0.0.1:5200
}

context /.well-known/acme-challenge {
  location                /home/maxkoc.com/public_html/.well-known/acme-challenge
  allowBrowse             1
  rewrite  {
    enable                0
  }
  addDefaultCharset       off
}

rewrite  {
  enable                  1
  RewriteCond             %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteCond             %{HTTPS} off
  RewriteRule             ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  autoLoadHtaccess        0
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/maxkoc.com/privkey.pem
  certFile                /etc/letsencrypt/live/maxkoc.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling           1
  ocspRespMaxAge           86400
}
