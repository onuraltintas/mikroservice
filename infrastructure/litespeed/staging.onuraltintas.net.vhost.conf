# LiteSpeed edge template for the existing VPS layout.
# The CyberPanel-created staging vhost is replaced only for this hostname.
docRoot                   /home/staging.onuraltintas.net/public_html
vhDomain                  staging.onuraltintas.net
vhAliases                 www.staging.onuraltintas.net
adminEmails               onuraltintas@gmail.com
enableGzip                1
enableIpGeo               1

index  {
  useServer               0
  indexFiles              index.html
}

errorlog /home/staging.onuraltintas.net/logs/staging.onuraltintas.net.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/staging.onuraltintas.net/logs/staging.onuraltintas.net.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

extprocessor eduplatform_staging_edge {
  type                    proxy
  address                 127.0.0.1:5100
  maxConns                200
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

context / {
  type                    proxy
  handler                 eduplatform_staging_edge
  addDefaultCharset       off
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1
  rewrite  {
    enable                0
  }
  addDefaultCharset       off
}

rewrite  {
  enable                  1
  RewriteCond             %{HTTPS} off
  RewriteRule             ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  autoLoadHtaccess        0
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/staging.onuraltintas.net/privkey.pem
  certFile                /etc/letsencrypt/live/staging.onuraltintas.net/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling           1
  ocspRespMaxAge           86400
}
