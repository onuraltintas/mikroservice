# Dedicated Eduİvme LiteSpeed vhost. Do not modify other site vhosts.
docRoot                   /home/eduivme.com/public_html
vhDomain                  eduivme.com
vhAliases                 www.eduivme.com, eduivme.com.tr, www.eduivme.com.tr
adminEmails               onuraltintas@gmail.com
enableGzip                1
enableIpGeo               1

index  {
  useServer               0
  indexFiles              index.html
}

errorlog /home/eduivme.com/logs/eduivme.com.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/eduivme.com/logs/eduivme.com.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

extprocessor eduivme_production_edge {
  type                    proxy
  address                 127.0.0.1:5200
  maxConns                200
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

context /.well-known/acme-challenge {
  location                /home/eduivme.com/public_html/.well-known/acme-challenge
  allowBrowse             1
  rewrite  {
    enable                0
  }
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 eduivme_production_edge
  addDefaultCharset       off
}

rewrite  {
  enable                  1
  RewriteCond             %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteCond             %{HTTPS} off
  RewriteRule             ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  autoLoadHtaccess        0
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/eduivme.com/privkey.pem
  certFile                /etc/letsencrypt/live/eduivme.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling           1
  ocspRespMaxAge           86400
}
