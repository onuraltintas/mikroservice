services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_IDENTITY} # Default DB, others created by script
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB_COACHING},${POSTGRES_DB_NOTIFICATION},${POSTGRES_DB_SPEED_READING_OWNED:-speedreading_owned_db}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - edu-network
    healthcheck:
      # A TCP listener check avoids spawning a full Erlang diagnostics VM.
      test: [ "CMD-SHELL", "nc -z -w 2 127.0.0.1 5672" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailCatcher (SMTP Mock)
  mailcatcher:
    image: dockage/mailcatcher:0.8.2
    container_name: mailcatcher
    ports:
      - "1080:1080" # Web UI
      - "${SMTP_PORT}:1025" # SMTP Port
    networks:
      - edu-network

  # ==========================================
  # MICROSERVICES
  # ==========================================

  # Gives the Data Protection volume to the non-root identity user (UID 1654). Needed once
  # for volumes created by the earlier root image; harmless afterwards.
  identity-volume-permissions:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/identity-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "-R", "1654:1654", "/var/lib/eduplatform/data-protection-keys"]
    volumes:
      - identity_data_protection:/var/lib/eduplatform/data-protection-keys
    network_mode: none
    restart: "no"

  # Identity Service
  identity-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/identity-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      # Trust the gateway hop on the internal network for X-Forwarded-For only (client
      # address in sessions and audit). Services are never published on the host.
      - ForwardedHeaders__KnownNetworks=${SERVICE_TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      - ForwardedHeaders__ForwardLimit=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30};GSS Encryption Mode=Disable
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      - AuthRecaptcha__Enabled=${AUTH_RECAPTCHA_ENABLED:-false}
      - AuthRecaptcha__SiteKey=${AUTH_RECAPTCHA_SITE_KEY:-}
      - AuthRecaptcha__SecretKey=${AUTH_RECAPTCHA_SECRET_KEY:-}
      - AuthRecaptcha__MinimumScore=${AUTH_RECAPTCHA_MINIMUM_SCORE:-0.5}
      - AuthRecaptcha__AllowedHostnames__0=${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_0:-eduivme.com}
      - AuthRecaptcha__AllowedHostnames__1=${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_1:-onuraltintas.net}
      - AuthRecaptcha__AllowedHostnames__2=${AUTH_RECAPTCHA_ALLOWED_HOSTNAME_2:-masterhizliokuma.com}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set}
      - PublicApp__BaseUrl=${PUBLIC_APP_BASE_URL:?PUBLIC_APP_BASE_URL must be set}
      - SpeedReadingPublicApp__BaseUrl=${SPEED_READING_PUBLIC_BASE_URL:-http://localhost:4200}
      # One-time production bootstrap. Clear BOOTSTRAP_ADMIN_PASSWORD after
      # the first successful identity-service start.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@eduivme.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Development/E2E only. Empty by default; never set these in Production.
      - TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD:-}
      - TEST_DEFAULT_PASSWORD=${TEST_DEFAULT_PASSWORD:-}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - identity_data_protection:/var/lib/eduplatform/data-protection-keys
    healthcheck:
      # The runtime image has no curl/wget; bash's /dev/tcp is enough for a local probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      identity-volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edu-network

  # Optional open-source malware scanner for attachment uploads.
  # Enable with: docker compose --profile security-scan up -d
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["security-scan"]
    environment:
      # The application accepts only JPEG/PNG/WebP attachments up to 10 MiB.
      CLAMD_CONF_MaxScanSize: 10M
      CLAMD_CONF_MaxFileSize: 10M
      CLAMD_CONF_StreamMaxLength: 10M
      # Avoid holding two full signature engines in memory during updates.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      # Keep attachment scanning bounded on the small production VPS.
      CLAMD_CONF_MaxThreads: "4"
      CLAMD_CONF_MaxQueue: "16"
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "1"
    mem_limit: 1536m
    cpus: "1.0"
    pids_limit: 128
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD-SHELL", "clamdscan --ping 3 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10

  # Gives the Coaching volumes (key ring, attachments, CMS media) to the non-root coaching
  # user (UID 1654). Needed once for volumes created by the earlier root image; harmless afterwards.
  coaching-volume-permissions:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/coaching-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "-R", "1654:1654", "/var/lib/eduplatform"]
    volumes:
      - coaching_data_protection:/var/lib/eduplatform/data-protection-keys
      - coaching_attachments:/var/lib/eduplatform/attachments
      - coaching_cms_media:/var/lib/eduplatform/coaching-cms-media
    network_mode: none
    restart: "no"

  # Coaching Service
  coaching-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/coaching-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30};GSS Encryption Mode=Disable
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
      - Services__IdentityService=http://identity-service:8080
      - COACHING_NEWSLETTER_RECAPTCHA_ENABLED=${COACHING_NEWSLETTER_RECAPTCHA_ENABLED:-false}
      - COACHING_NEWSLETTER_RECAPTCHA_SITE_KEY=${COACHING_NEWSLETTER_RECAPTCHA_SITE_KEY:-}
      - COACHING_NEWSLETTER_RECAPTCHA_SECRET_KEY=${COACHING_NEWSLETTER_RECAPTCHA_SECRET_KEY:-}
      - COACHING_NEWSLETTER_RECAPTCHA_MINIMUM_SCORE=${COACHING_NEWSLETTER_RECAPTCHA_MINIMUM_SCORE:-0.5}
      - COACHING_NEWSLETTER_RECAPTCHA_ALLOWED_HOSTNAMES=${COACHING_NEWSLETTER_RECAPTCHA_ALLOWED_HOSTNAMES:-}
      - Coaching__Attachments__RootPath=/var/lib/eduplatform/attachments
      - Coaching__CmsMedia__RootPath=/var/lib/eduplatform/coaching-cms-media
      - Coaching__Attachments__UploadUrlLifetimeMinutes=15
      - Coaching__Attachments__Provider=Local
      - Coaching__Attachments__Scanner__Provider=${ATTACHMENT_SCANNER_PROVIDER:-Local}
      - Coaching__Attachments__Scanner__ClamAvHost=${ATTACHMENT_SCANNER_CLAMAV_HOST:-clamav}
      - Coaching__Attachments__Scanner__ClamAvPort=${ATTACHMENT_SCANNER_CLAMAV_PORT:-3310}
      - Coaching__Attachments__Scanner__TimeoutSeconds=${ATTACHMENT_SCANNER_TIMEOUT_SECONDS:-10}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - coaching_data_protection:/var/lib/eduplatform/data-protection-keys
      - coaching_attachments:/var/lib/eduplatform/attachments
      - coaching_cms_media:/var/lib/eduplatform/coaching-cms-media
    depends_on:
      coaching-volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - edu-network

  # Gives the Speed Reading volumes (key ring, CMS media) to the non-root user (UID 1654).
  # Needed once for volumes created by the earlier root image; harmless afterwards.
  speed-reading-volume-permissions:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/speed-reading-service:${RELEASE_TAG:-dev}
    profiles: ["speed-reading"]
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "-R", "1654:1654", "/var/lib/eduplatform"]
    volumes:
      - speed_reading_data_protection:/var/lib/eduplatform/data-protection-keys
      - speed_reading_media:/var/lib/eduplatform/media
    network_mode: none
    restart: "no"

  # Speed Reading Service. Production/staging overlays remove the optional
  # profile; every environment uses the owned Speed Reading database.
  speed-reading-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/speed-reading-service:${RELEASE_TAG:-dev}
    profiles: ["speed-reading"]
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__SpeedReadingOwned=${SPEED_READING_OWNED_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/speed-reading-service:${RELEASE_TAG:-dev}
    profiles: ["speed-reading"]
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__SpeedReadingOwned=${SPEED_READING_OWNED_CONNECTION_STRING:-}
      - SpeedReading__Mode=${SPEED_READING_MODE:-Standalone}
      - SpeedReading__CoachingIntegrationEnabled=${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      - SpeedReading__NotificationIntegrationEnabled=${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      - SpeedReading__SubscriptionIntegrationEnabled=${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GOOGLE_RECAPTCHA_ENABLED=${GOOGLE_RECAPTCHA_ENABLED:-false}
      - GOOGLE_RECAPTCHA_SITE_KEY=${GOOGLE_RECAPTCHA_SITE_KEY:-}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY:-}
      - GOOGLE_RECAPTCHA_MINIMUM_SCORE=${GOOGLE_RECAPTCHA_MINIMUM_SCORE:-0.5}
      - GOOGLE_RECAPTCHA_ALLOWED_HOSTNAMES=${GOOGLE_RECAPTCHA_ALLOWED_HOSTNAMES:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set}
      - Services__IdentityService=http://identity-service:8080
      - Services__NotificationService=http://notification-service:8080
      - SpeedReading__CmsMedia__RootPath=/var/lib/eduplatform/media
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - speed_reading_data_protection:/var/lib/eduplatform/data-protection-keys
      - speed_reading_media:/var/lib/eduplatform/media
    networks:
      - edu-network
    depends_on:
      speed-reading-volume-permissions:
        condition: service_completed_successfully
      speed-reading-migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Standalone Speed Reading web client. Keep it behind the edge in staging and
  # production; the profile makes the base stack opt-in for local development.
  speed-reading-frontend:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/speed-reading-frontend:${RELEASE_TAG:-dev}
    profiles: ["speed-reading"]
    build:
      context: ./clients
      dockerfile: speed-reading/Dockerfile
      args:
        RELEASE_TAG: ${RELEASE_TAG:-dev}
    expose:
      - "8080"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  # Notification Service
  notification-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/notification-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30};GSS Encryption Mode=Disable
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - Services__IdentityService=http://identity-service:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
      - Email__Host=${SMTP_HOST}
      - Email__Port=${SMTP_PORT}
      - Email__From=${SMTP_FROM_EMAIL}
      - Email__Username=${SMTP_USERNAME}
      - Email__Password=${SMTP_PASSWORD}
      - Email__FromName=${SMTP_FROM_NAME}
      - PublicApp__BaseUrl=${PUBLIC_APP_BASE_URL:?PUBLIC_APP_BASE_URL must be set}
      - PublicApp__SpeedReadingBaseUrl=${SPEED_READING_PUBLIC_BASE_URL:-http://localhost:4200}
      - CoachingNotices__AdminAlertEmail=${COACHING_ADMIN_ALERT_EMAIL:-}
      - TextMessaging__Enabled=${TEXT_MESSAGING_ENABLED:-false}
      - TextMessaging__Provider=${TEXT_MESSAGING_PROVIDER:-}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - notification_data_protection:/var/lib/eduplatform/data-protection-keys
    # Notification is reachable through the gateway; keep the service internal.
    depends_on:
      notification-volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - edu-network

  # Gives the notification key-ring volume to the non-root user (UID 1654); needed once for
  # volumes created by the earlier root image. Without it queued e-mails cannot be decrypted.
  notification-volume-permissions:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/notification-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "-R", "1654:1654", "/var/lib/eduplatform/data-protection-keys"]
    volumes:
      - notification_data_protection:/var/lib/eduplatform/data-protection-keys
    network_mode: none
    restart: "no"

  # One-shot ownership fix for the gateway key-ring volume. The gateway image runs as the
  # non-root app user (UID 1654); volumes created while older images ran as root keep root
  # ownership, so this idempotent step must finish before the gateway starts.
  api-gateway-volume-permissions:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/api-gateway:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "-R", "1654:1654", "/var/lib/eduplatform/data-protection-keys"]
    volumes:
      - gateway_data_protection:/var/lib/eduplatform/data-protection-keys
    network_mode: none
    restart: "no"

  # API Gateway (YARP)
  api-gateway:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/api-gateway:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__coaching-cluster__Destinations__destination1__Address=http://coaching-service:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-service:8080
      - ReverseProxy__Clusters__speed-reading-cluster__Destinations__destination1__Address=http://speed-reading-service:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ForwardedHeaders__ForwardLimit=${FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      - ForwardedHeaders__KnownProxies=${FORWARDED_HEADERS_KNOWN_PROXIES:-}
      - ForwardedHeaders__KnownNetworks=${FORWARDED_HEADERS_KNOWN_NETWORKS:-}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - gateway_data_protection:/var/lib/eduplatform/data-protection-keys
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      api-gateway-volume-permissions:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      coaching-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - edu-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  identity_data_protection:
  coaching_data_protection:
  coaching_attachments:
  coaching_cms_media:
  clamav_data:
  notification_data_protection:
  gateway_data_protection:
  speed_reading_data_protection:
  speed_reading_media:


networks:
  edu-network:
    driver: bridge
