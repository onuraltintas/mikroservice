services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_IDENTITY} # Default DB, others created by script
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB_COACHING},${POSTGRES_DB_NOTIFICATION}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailCatcher (SMTP Mock)
  mailcatcher:
    image: dockage/mailcatcher:0.8.2
    container_name: mailcatcher
    ports:
      - "1080:1080" # Web UI
      - "${SMTP_PORT}:1025" # SMTP Port
    networks:
      - edu-network

  # ==========================================
  # MICROSERVICES
  # ==========================================

  # Identity Service
  identity-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/identity-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
      # One-time production bootstrap. Clear BOOTSTRAP_ADMIN_PASSWORD after
      # the first successful identity-service start.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@eduivme.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Development/E2E only. Empty by default; never set these in Production.
      - TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD:-}
      - TEST_DEFAULT_PASSWORD=${TEST_DEFAULT_PASSWORD:-}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - identity_data_protection:/var/lib/eduplatform/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edu-network

  # Optional open-source malware scanner for attachment uploads.
  # Enable with: docker compose --profile security-scan up -d
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["security-scan"]
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - edu-network
    healthcheck:
      test: [ "CMD-SHELL", "clamdscan --ping 3 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10

  # Optional OSS S3-compatible object storage for horizontally scaled Coaching.
  # Enable with: docker compose --profile object-storage up -d minio
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - edu-network

  # Coaching Service
  coaching-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/coaching-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
      - Services__IdentityService=http://identity-service:8080
      - Coaching__Attachments__RootPath=/var/lib/eduplatform/attachments
      - Coaching__Attachments__UploadUrlLifetimeMinutes=15
      - Coaching__Attachments__Provider=${ATTACHMENT_STORAGE_PROVIDER:-Local}
      - Coaching__Attachments__MinioEndpoint=${ATTACHMENT_MINIO_ENDPOINT:-minio:9000}
      - Coaching__Attachments__MinioAccessKey=${ATTACHMENT_MINIO_ACCESS_KEY:-}
      - Coaching__Attachments__MinioSecretKey=${ATTACHMENT_MINIO_SECRET_KEY:-}
      - Coaching__Attachments__MinioBucket=${ATTACHMENT_MINIO_BUCKET:-eduplatform-attachments}
      - Coaching__Attachments__MinioUseSsl=${ATTACHMENT_MINIO_USE_SSL:-false}
      - Coaching__Attachments__Scanner__Provider=${ATTACHMENT_SCANNER_PROVIDER:-Local}
      - Coaching__Attachments__Scanner__ClamAvHost=${ATTACHMENT_SCANNER_CLAMAV_HOST:-clamav}
      - Coaching__Attachments__Scanner__ClamAvPort=${ATTACHMENT_SCANNER_CLAMAV_PORT:-3310}
      - Coaching__Attachments__Scanner__TimeoutSeconds=${ATTACHMENT_SCANNER_TIMEOUT_SECONDS:-10}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - coaching_data_protection:/var/lib/eduplatform/data-protection-keys
      - coaching_attachments:/var/lib/eduplatform/attachments
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - edu-network

  # Speed Reading Service. It is optional in the base stack because it can
  # point at the existing Hızlı Okuma database rather than the platform DB.
  # Production/staging overlays remove the profile when the service is enabled.
  speed-reading-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/speed-reading-service:${RELEASE_TAG:-dev}
    profiles: ["speed-reading"]
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__SpeedReading=${SPEED_READING_CONNECTION_STRING:-}
      - SpeedReading__Mode=${SPEED_READING_MODE:-Standalone}
      - SpeedReading__CoachingIntegrationEnabled=${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      - SpeedReading__NotificationIntegrationEnabled=${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      - SpeedReading__SubscriptionIntegrationEnabled=${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
    networks:
      - edu-network

  # Notification Service
  notification-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/notification-service:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - Services__IdentityService=http://identity-service:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - INTERNAL_SERVICE_API_KEY=${INTERNAL_SERVICE_API_KEY}
      - Email__Host=${SMTP_HOST}
      - Email__Port=${SMTP_PORT}
      - Email__From=${SMTP_FROM_EMAIL}
      - Email__Username=${SMTP_USERNAME}
      - Email__Password=${SMTP_PASSWORD}
      - Email__FromName=${SMTP_FROM_NAME}
      - PublicApp__BaseUrl=${PUBLIC_APP_BASE_URL:?PUBLIC_APP_BASE_URL must be set}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - notification_data_protection:/var/lib/eduplatform/data-protection-keys
    # Notification is reachable through the gateway; keep the service internal.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - edu-network

  # API Gateway (YARP)
  api-gateway:
    image: ${PRODUCTION_IMAGE_REPOSITORY:-eduivme}/api-gateway:${RELEASE_TAG:-dev}
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set to Development, Staging or Production}
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__coaching-cluster__Destinations__destination1__Address=http://coaching-service:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-service:8080
      - ReverseProxy__Clusters__speed-reading-cluster__Destinations__destination1__Address=http://speed-reading-service:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_KEY_ID=${JWT_KEY_ID:-}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - JWT_PREVIOUS_KEY_IDS=${JWT_PREVIOUS_KEY_IDS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ForwardedHeaders__ForwardLimit=${FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      - ForwardedHeaders__KnownProxies=${FORWARDED_HEADERS_KNOWN_PROXIES:-}
      - ForwardedHeaders__KnownNetworks=${FORWARDED_HEADERS_KNOWN_NETWORKS:-}
      - DataProtection__KeysPath=/var/lib/eduplatform/data-protection-keys
      - DataProtection__CertificatePath=${DATAPROTECTION_CERTIFICATE_PATH:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
    volumes:
      - gateway_data_protection:/var/lib/eduplatform/data-protection-keys
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      identity-service:
        condition: service_started
      coaching-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - edu-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  identity_data_protection:
  coaching_data_protection:
  coaching_attachments:
  clamav_data:
  minio_data:
  notification_data_protection:
  gateway_data_protection:


networks:
  edu-network:
    driver: bridge
