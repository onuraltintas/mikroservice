# Disposable/staging overlay for a single VPS.
# It keeps infrastructure private, runs migrations before web services and
# exposes only Caddy on ports 80/443. Use a separate .env.staging file and
# start with --profile security-scan --profile object-storage.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    ports: !reset []
    restart: unless-stopped

  mailcatcher:
    ports: !reset []
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped
    depends_on:
      identity-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  identity-migrations:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  coaching-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped
    depends_on:
      coaching-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio:
        condition: service_healthy

  coaching-migrations:
    build:
      context: .
      dockerfile: services/coaching-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-service:
    profiles: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SpeedReading: ${SPEED_READING_CONNECTION_STRING:?SPEED_READING_CONNECTION_STRING must be set for speed-reading}
      SpeedReading__Mode: ${SPEED_READING_MODE:-Standalone}
      SpeedReading__CoachingIntegrationEnabled: ${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      SpeedReading__NotificationIntegrationEnabled: ${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      SpeedReading__SubscriptionIntegrationEnabled: ${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      speed-reading-migrations:
        condition: service_completed_successfully
    networks:
      - edu-network

  speed-reading-migrations:
    profiles: !reset []
    build:
      context: .
      dockerfile: services/speed-reading-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SpeedReading: ${SPEED_READING_CONNECTION_STRING:?SPEED_READING_CONNECTION_STRING must be set for speed-reading}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-frontend:
    profiles: !reset []
    build:
      context: ./clients/speed-reading
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  notification-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-migrations:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  api-gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    ports: !reset []
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      coaching-service:
        condition: service_started
      notification-service:
        condition: service_started
      speed-reading-service:
        condition: service_started

  admin-panel:
    build:
      context: ./clients/admin-panel
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  staging-edge:
    image: caddy:2.9.1-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN must be set}
      TLS_ACME_EMAIL: ${TLS_ACME_EMAIL:?TLS_ACME_EMAIL must be set}
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin-panel:
        condition: service_healthy
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - edu-network

volumes:
  caddy_data:
  caddy_config:

networks:
  edu-network:
    ipam:
      config:
        - subnet: 172.30.0.0/16
