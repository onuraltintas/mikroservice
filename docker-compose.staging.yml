# Disposable/staging overlay for a single VPS.
# It keeps infrastructure private, runs migrations before web services and
# exposes only Caddy on ports 80/443. Use a separate .env.staging file.
services:
  postgres:
    container_name: eduivme-staging-postgres
    ports: !reset []
    restart: unless-stopped

  redis:
    container_name: eduivme-staging-redis
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    container_name: eduivme-staging-rabbitmq
    ports: !reset []
    restart: unless-stopped

  mailcatcher:
    container_name: eduivme-staging-mailcatcher
    ports: !reset []
    restart: unless-stopped

  clamav:
    # Attachment malware scanning is required by the staging coaching
    # service; remove the development-only profile in this overlay.
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  identity-service:
    image: eduivme-staging/identity-service:${STAGING_RELEASE_TAG:-snapshot}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped
    depends_on:
      identity-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  identity-migrations:
    image: eduivme-staging/identity-service:${STAGING_RELEASE_TAG:-snapshot}
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_IDENTITY};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  coaching-service:
    image: eduivme-staging/coaching-service:${STAGING_RELEASE_TAG:-snapshot}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Coaching__Attachments__Provider: Local
      Coaching__Attachments__RootPath: /var/lib/eduplatform/attachments
      Coaching__Attachments__Scanner__Provider: ClamAv
    restart: unless-stopped
    depends_on:
      coaching-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  coaching-migrations:
    image: eduivme-staging/coaching-service:${STAGING_RELEASE_TAG:-snapshot}
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_COACHING};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-service:
    profiles: !reset []
    image: eduivme-staging/speed-reading-service:${STAGING_RELEASE_TAG:-snapshot}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
      SpeedReading__Mode: ${SPEED_READING_MODE:-Standalone}
      SpeedReading__CoachingIntegrationEnabled: ${SPEED_READING_COACHING_INTEGRATION_ENABLED:-false}
      SpeedReading__NotificationIntegrationEnabled: ${SPEED_READING_NOTIFICATION_INTEGRATION_ENABLED:-false}
      SpeedReading__SubscriptionIntegrationEnabled: ${SPEED_READING_SUBSCRIPTION_INTEGRATION_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set for speed-reading}
      Services__IdentityService: http://identity-service:8080
      Services__NotificationService: http://notification-service:8080
      SpeedReading__CmsMedia__RootPath: /var/lib/eduplatform/media
    volumes:
      - speed_reading_media:/var/lib/eduplatform/media
    restart: unless-stopped
    depends_on:
      speed-reading-migrations:
        condition: service_completed_successfully
      notification-service:
        condition: service_started
    networks:
      - edu-network

  speed-reading-migrations:
    profiles: !reset []
    image: eduivme-staging/speed-reading-service:${STAGING_RELEASE_TAG:-snapshot}
    build: !reset null
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__SpeedReadingOwned: ${SPEED_READING_OWNED_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  speed-reading-frontend:
    profiles: !reset []
    image: eduivme-staging/speed-reading-frontend:${STAGING_RELEASE_TAG:-snapshot}
    build:
      context: ./clients
      dockerfile: speed-reading/Dockerfile
    environment:
      NODE_ENV: production
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  notification-service:
    image: eduivme-staging/notification-service:${STAGING_RELEASE_TAG:-snapshot}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-migrations:
    image: eduivme-staging/notification-service:${STAGING_RELEASE_TAG:-snapshot}
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB_NOTIFICATION};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  api-gateway:
    image: eduivme-staging/api-gateway:${STAGING_RELEASE_TAG:-snapshot}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    ports: !reset []
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      coaching-service:
        condition: service_started
      notification-service:
        condition: service_started
      speed-reading-service:
        condition: service_started

  admin-panel:
    image: eduivme-staging/admin-panel:${STAGING_RELEASE_TAG:-snapshot}
    build:
      context: ./clients
      dockerfile: admin-panel/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      ADMIN_PANEL_ADDITIONAL_ALLOWED_HOSTS: staging.onuraltintas.net
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edu-network

  staging-edge:
    image: caddy:2.9.1-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN must be set}
      TLS_ACME_EMAIL: ${TLS_ACME_EMAIL:?TLS_ACME_EMAIL must be set}
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin-panel:
        condition: service_healthy
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - edu-network

volumes:
  caddy_data:
  caddy_config:

networks:
  edu-network:
    ipam:
      config:
        - subnet: 172.29.0.0/16
