# Optional production overlay for Course Management.
# Use with docker-compose.yml and docker-compose.production.yml. Provision a
# dedicated database and least-privilege role before running its migration job.
# First release (19.11.2026): an institution panel only. Homework files and the
# student application are off, so no virus scanner runs; to turn files on, add
# docker-compose.course-management.attachments.production.yml after this file.
services:
  # An account erasure waits for Course Management's answer only where it runs.
  identity-service:
    environment:
      CourseManagement__Enabled: "true"

  # Course Management notifications (queues and API) are off unless this overlay is used.
  notification-service:
    environment:
      CourseManagement__Enabled: "true"

  course-management-migrations:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/course-management-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/course-management-service/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      COURSE_MANAGEMENT_CONNECTION_STRING: ${COURSE_MANAGEMENT_CONNECTION_STRING:?COURSE_MANAGEMENT_CONNECTION_STRING must target the dedicated Course Management database and role}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edu-network

  course-management-service:
    image: ${PRODUCTION_IMAGE_REPOSITORY:?PRODUCTION_IMAGE_REPOSITORY must be set for production}/course-management-service:${RELEASE_TAG:?RELEASE_TAG must be set for production}
    build:
      context: .
      dockerfile: services/course-management-service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      COURSE_MANAGEMENT_CONNECTION_STRING: ${COURSE_MANAGEMENT_CONNECTION_STRING:?COURSE_MANAGEMENT_CONNECTION_STRING must target the dedicated Course Management database and role}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      JWT_PREVIOUS_KEY_IDS: ${JWT_PREVIOUS_KEY_IDS:-}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY must be set for identity erasure readiness}
      Services__IdentityService: http://identity-service:8080
      Services__NotificationService: http://notification-service:8080
      # Set BILLING_ENABLED=true where the billing overlay runs: the workspace plan is then read from the billing service.
      Billing__Enabled: ${BILLING_ENABLED:-false}
      Services__BillingService: http://billing-service:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COURSE_MANAGEMENT_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: EduPlatform.CourseManagement
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      # Institution e-mails: unsubscribe links open on the institution portal's address.
      CourseManagement__Email__PublicBaseUrl: ${COURSE_MANAGEMENT_PUBLIC_URL:-https://kurum.eduivme.com}
      AllowedHosts: ${COURSE_MANAGEMENT_ALLOWED_HOSTS:?COURSE_MANAGEMENT_ALLOWED_HOSTS must be set}
    depends_on:
      course-management-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl/wget; bash's /dev/tcp is enough. The Host header must be an allowed host.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: course-management-service\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - edu-network

  api-gateway:
    environment:
      CourseManagement__Enabled: "true"
      ReverseProxy__Clusters__course-management-cluster__Destinations__destination1__Address: http://course-management-service:8080
    depends_on:
      course-management-service:
        condition: service_started
