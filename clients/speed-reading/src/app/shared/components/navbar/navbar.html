<nav class="navbar" [class.scrolled]="isScrolled">
    <div class="container">
        <a routerLink="/" class="logo" (click)="onLogoClick($event)">
            <div class="logo-icon" [class.scrolled]="isScrolled">
                <img src="assets/icons/apple-touch-icon.png" alt="Hızlı Okuma Logo">
            </div>
            <span [class.scrolled]="isScrolled">Hızlı Okuma</span>
        </a>

        <!-- Desktop Navigation -->
        <div class="nav-links desktop-only">
            <ng-container *ngFor="let link of navLinks">
                <a *ngIf="link.external" [href]="link.href" [target]="link.openInNewTab ? '_blank' : undefined"
                    [attr.rel]="link.openInNewTab ? 'noopener' : null" [class.scrolled]="isScrolled">
                    {{ link.label }}
                </a>
                <a *ngIf="!link.external" [routerLink]="link.fragment ? ['/'] : [link.href]"
                    [fragment]="link.fragment" (click)="onNavLinkClick($event, link)" [target]="link.openInNewTab ? '_blank' : undefined"
                    [class.scrolled]="isScrolled">
                    {{ link.label }}
                </a>
            </ng-container>
            <div class="lang-switcher" [class.scrolled]="isScrolled">
                <button (click)="switchLanguage('tr')" [class.active]="currentLanguage() === 'tr'">TR</button>
                <span>|</span>
                <button (click)="switchLanguage('en')" [class.active]="currentLanguage() === 'en'">EN</button>
            </div>
            <a routerLink="/auth/login" [class.scrolled]="isScrolled">Giriş Yap</a>
            <button mat-raised-button [class.primary]="!isScrolled" [class.white]="isScrolled"
                routerLink="/auth/register">
                Ücretsiz Dene
            </button>
        </div>

        <!-- Mobile Toggle -->
        <button type="button" mat-icon-button class="mobile-toggle" (click)="toggleMobileMenu()"
            [attr.aria-label]="mobileMenuOpen ? 'Menüyü kapat' : 'Menüyü aç'"
            [attr.aria-expanded]="mobileMenuOpen">
            <mat-icon [class.scrolled]="isScrolled">
                {{ mobileMenuOpen ? 'close' : 'menu' }}
            </mat-icon>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" [class.open]="mobileMenuOpen">
        <div class="mobile-menu-content">
            <ng-container *ngFor="let link of navLinks">
                <a *ngIf="link.external" [href]="link.href" [target]="link.openInNewTab ? '_blank' : undefined"
                    [attr.rel]="link.openInNewTab ? 'noopener' : null" (click)="closeMobileMenu()">
                    {{ link.label }}
                </a>
                <a *ngIf="!link.external" [routerLink]="link.fragment ? ['/'] : [link.href]"
                    [fragment]="link.fragment" (click)="onNavLinkClick($event, link)" [target]="link.openInNewTab ? '_blank' : undefined">
                    {{ link.label }}
                </a>
            </ng-container>
            <a routerLink="/auth/login" (click)="closeMobileMenu()">Giriş Yap</a>
            <button mat-raised-button color="primary" routerLink="/auth/register" (click)="closeMobileMenu()">
                Ücretsiz Dene
            </button>
        </div>
    </div>
</nav>
