<div class="newsletter-widget" [class.minimized]="isMinimized">
    <button type="button" class="newsletter-header" (click)="toggleMinimize()" [attr.aria-expanded]="!isMinimized">
        <span>Haftalık bülten</span>
        <mat-icon aria-hidden="true">{{ isMinimized ? 'expand_more' : 'expand_less' }}</mat-icon>
    </button>

    <div class="newsletter-content" *ngIf="!isMinimized">
        <p>En yeni içeriklerimizi e-posta ile alın.</p>
        <p *ngIf="privacyLoading" class="privacy-status">Gizlilik metni yükleniyor…</p>
        <p *ngIf="!privacyLoading && (privacyPolicyVersion === null || newsletterConsentVersion === null)" class="privacy-status">
            Abonelik için ortak gizlilik ve Hızlı Okuma bülten onay metinlerinin yayımlanmış olması gerekir.
        </p>

        <form [formGroup]="newsletterForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="email-field">
                <mat-label>E-posta adresiniz</mat-label>
                <input matInput type="email" formControlName="email" placeholder="ornek@email.com">
                <mat-error *ngIf="newsletterForm.get('email')?.hasError('required')">
                    E-posta gereklidir
                </mat-error>
                <mat-error *ngIf="newsletterForm.get('email')?.hasError('email')">
                    Geçerli bir e-posta adresi giriniz
                </mat-error>
            </mat-form-field>

            <div class="newsletter-honeypot" aria-hidden="true">
                <label for="blog-newsletter-website">Web sitesi</label>
                <input id="blog-newsletter-website" type="text" formControlName="honeypot"
                    tabindex="-1" autocomplete="off">
            </div>

            <label class="consent-label">
                <input type="checkbox" formControlName="consentGiven" required>
                <span>
                    <a href="/legal/speed-reading-newsletter-consent" target="_blank" rel="noopener noreferrer">Bülten onay metni</a> kapsamında Hızlı Okuma bültenini e-posta ile almayı kabul ediyorum.
                    <a href="/legal/privacy" target="_blank" rel="noopener noreferrer">Ortak gizlilik politikası</a>
                </span>
            </label>
            <p *ngIf="newsletterForm.get('consentGiven')?.touched && newsletterForm.get('consentGiven')?.invalid"
                class="consent-error">Devam etmek için açık onay vermeniz gerekir.</p>

            <button class="ds-btn ds-btn--primary ds-btn--block" type="submit"
                [disabled]="newsletterForm.invalid || loading || privacyPolicyVersion === null || newsletterConsentVersion === null"
                class="subscribe-button">
                <span *ngIf="!loading">Abone ol</span>
                <span *ngIf="loading">Abone Olunuyor...</span>
            </button>
        </form>
    </div>
</div>
