<div class="streak-container" [matTooltip]="tooltipText">
    <div class="streak-icon">{{ streakIcon }}</div>
    <div class="streak-info">
        <div class="streak-value">{{ currentStreak }} Gün</div>
        <div class="streak-label">Seri</div>
    </div>
    @if (streakFreezeCount > 0) {
    <div class="freeze-count" matTooltip="Mevcut dondurucu sayısı">
        ❄️ × {{ streakFreezeCount }}
    </div>
    }
</div>
