<div class="notification-bell" (clickOutside)="closeDropdown()">
  <button class="bell-button" (click)="toggleDropdown()" [class.has-notifications]="unreadCount.total > 0">
    <span class="material-icons">notifications</span>
    <span class="badge" *ngIf="unreadCount.total > 0" [class.urgent]="unreadCount.urgent > 0">
      {{ unreadCount.total > 99 ? '99+' : unreadCount.total }}
    </span>
  </button>

  <div class="notification-dropdown fade-in" *ngIf="isDropdownOpen">
    <div class="dropdown-header">
      <div class="header-content">
        <h3>Bildirimler</h3>
        <span class="count-badge" *ngIf="unreadCount.total > 0">{{ unreadCount.total }} yeni</span>
      </div>
    </div>

    <div class="notification-list custom-scrollbar" *ngIf="recentNotifications.length > 0">
      <div *ngFor="let notification of recentNotifications" class="notification-item"
        [class.unread]="!notification.isRead" (click)="onNotificationClick(notification)">

        <div class="icon-avatar" [style.color]="getPriorityColor(notification)">
          <span class="material-icons">{{ getNotificationIcon(notification) }}</span>
        </div>

        <div class="item-content">
          <div class="item-top">
            <span class="item-title">{{ notification.title }}</span>
            <span class="item-time">{{ getRelativeTime(notification.createdAt) }}</span>
          </div>
          <p class="item-message">{{ notification.message }}</p>
        </div>

        <div class="unread-dot" *ngIf="!notification.isRead"></div>
      </div>
    </div>

    <div class="empty-state" *ngIf="recentNotifications.length === 0">
      <div class="empty-illustration">
        <span class="material-icons">notifications_paused</span>
      </div>
      <p class="empty-title">Bildirim Yok</p>
      <p class="empty-desc">Şu an için her şey yolunda!</p>
    </div>

    <div class="dropdown-footer">
      <button class="push-toggle" (click)="enablePushNotifications()" title="Masaüstü Bildirimlerini Aç">
        <span class="material-icons">campaign</span>
      </button>
      <button class="view-all" (click)="viewAllNotifications()">
        Tümünü Gör
        <span class="material-icons">arrow_forward</span>
      </button>
    </div>
  </div>
</div>
