<div class="confirmation-dialog">
    <div class="dialog-header">
        <mat-icon class="dialog-icon">help_outline</mat-icon>
        <h2 class="dialog-title">{{ data.title }}</h2>
    </div>
    <div class="dialog-content">
        <p class="dialog-message">{{ data.message }}</p>
    </div>
    <div class="dialog-actions">
        <button mat-stroked-button class="cancel-btn" (click)="onCancel()">
            {{ data.cancelText || 'İptal' }}
        </button>
        <button mat-flat-button color="primary" class="confirm-btn" (click)="onConfirm()">
            {{ data.confirmText || 'Tamam' }}
        </button>
    </div>
</div>
