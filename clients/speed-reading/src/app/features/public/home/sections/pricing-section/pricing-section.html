<section class="pricing-section" id="fiyatlandirma">
    <div class="container">
        <div class="section-header">
            <h2>{{ title }}</h2>
            <p>{{ subtitle }}</p>
        </div>

        <div *ngIf="loading" class="loading-state">
            <mat-spinner diameter="40"></mat-spinner>
        </div>

        <div *ngIf="!loading" class="pricing-grid">
            <div class="pricing-card" *ngFor="let plan of plans" [class.popular]="isPopular(plan)">
                <div class="popular-badge" *ngIf="isPopular(plan)">En Çok Tercih Edilen</div>

                <div class="card-header">
                    <h3>{{ plan.name }}</h3>
                    <p class="plan-description">{{ plan.description }}</p>
                    <div class="price">
                        <span class="amount">{{ formatPrice(plan) }}</span>
                        <span class="period" *ngIf="getPeriod(plan)">{{ getPeriod(plan) }}</span>
                    </div>
                </div>

                <div class="card-body">
                    <ul class="features-list" *ngIf="plan.features && plan.features.length > 0">
                        <li *ngFor="let feature of plan.features">
                            <mat-icon>check_circle</mat-icon>
                            {{ feature }}
                        </li>
                    </ul>
                </div>

                <div class="card-footer">
                    <a mat-flat-button [color]="isPopular(plan) ? 'primary' : ''"
                        routerLink="/odeme" class="cta-button">
                        Planı Seç
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
