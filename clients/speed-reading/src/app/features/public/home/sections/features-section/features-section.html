<section id="ozellikler" class="features-section">
    <div class="container">
        <div class="section-header">
            <h2>Neden Hızlı Okuma Platformu?</h2>
            <p>Bilimsel araştırmalara dayalı, kişiselleştirilmiş eğitim programımızla okuma becerilerinizi geliştirin
            </p>
        </div>

        <div class="features-grid">
            <mat-card *ngFor="let feature of features" class="feature-card">
                <div class="icon-wrapper">
                    <mat-icon>{{ feature.icon }}</mat-icon>
                </div>
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
            </mat-card>
        </div>
    </div>
</section>
