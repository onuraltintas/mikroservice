<section class="testimonials-section">
    <div class="container">
        <div class="section-header">
            <h2>Kullanıcılarımız Ne Diyor?</h2>
            <p>Binlerce kullanıcımızın başarı hikayelerinden bazıları</p>
        </div>

        <div class="testimonials-grid">
            <mat-card *ngFor="let testimonial of testimonials" class="testimonial-card">
                <div class="card-header">
                    <div class="avatar">{{ testimonial.avatar }}</div>
                    <div class="user-info">
                        <h4>{{ testimonial.name }}</h4>
                        <p>{{ testimonial.role }}</p>
                    </div>
                </div>

                <div class="rating">
                    <mat-icon *ngFor="let star of getStars(testimonial.rating)" [class.filled]="star === 1">
                        star
                    </mat-icon>
                </div>

                <p class="testimonial-text">"{{ testimonial.text }}"</p>
            </mat-card>
        </div>
    </div>
</section>
