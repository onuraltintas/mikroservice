<section class="faq-section" aria-labelledby="faq-title">
  <div class="container">
    <div class="section-head-row">
      <div class="section-header">
        <h2 id="faq-title">{{ content.title }}</h2>
        <p>{{ content.subtitle }}</p>
      </div>
      <a routerLink="/sss" class="ds-link view-all-btn">{{ content.actionLabel || 'Tüm soruları gör' }}</a>
    </div>
    @if (content.items.length) {
      <div class="faq-list">
        @for (faq of content.items; track faq.question) {
          <details>
            <summary><span class="question-text">{{ faq.question }}</span>@if (faq.category) { <span class="category-badge">{{ faq.category }}</span> }</summary>
            <p>{{ faq.answer }}</p>
          </details>
        }
      </div>
    }
  </div>
</section>
