<section class="faq-section">
    <div class="container">
        <div class="section-header">
            <h2>{{ content.title }}</h2>
            <p>{{ content.subtitle }}</p>
        </div>

        <mat-accordion *ngIf="faqs.length" class="faq-accordion">
            <mat-expansion-panel *ngFor="let faq of faqs">
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        <div class="faq-header-content">
                            <span class="category-badge">{{ faq.category }}</span>
                            <span class="question-text">{{ faq.question }}</span>
                        </div>
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <p>{{ faq.answer }}</p>
            </mat-expansion-panel>
        </mat-accordion>

        <div class="view-all-container">
            <a routerLink="/sss" class="view-all-btn">
                <mat-icon>help_outline</mat-icon>
                {{ content.actionLabel || 'Tüm soruları gör' }}
                <mat-icon>arrow_forward</mat-icon>
            </a>
        </div>
    </div>
</section>
