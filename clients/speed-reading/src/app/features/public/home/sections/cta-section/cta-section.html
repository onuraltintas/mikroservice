<section class="cta-section" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta-panel">
      <div class="cta-copy">
        <h2 id="cta-title">{{ content.title }}</h2>
        <p>{{ content.subtitle }}</p>
      </div>
      <div class="cta-action">
        <button type="button" class="ds-btn ds-btn--large cta-button" (click)="startTrial()">{{ content.actionLabel || 'Başla' }}</button>
        @if (content.smallText) { <p class="small-text">{{ content.smallText }}</p> }
      </div>
    </div>
  </div>
</section>
