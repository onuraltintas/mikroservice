<section class="hero-section">
    <!-- Background decorative elements -->
    <div class="bg-decorations">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>
    </div>

    <div class="container">
        <div class="content-grid">
            <!-- Left Content -->
            <div class="text-content">
                <h1 class="title">
                    {{ title }}
                </h1>

                <p class="subtitle">
                    {{ subtitle }}
                </p>

                <div class="cta-buttons">
                    <button mat-raised-button color="accent" class="primary-btn" (click)="startFreeTrial()">
                        Ücretsiz Deneyin
                    </button>
                    <button mat-stroked-button class="secondary-btn" (click)="scrollToFeatures()">
                        Nasıl Çalışır?
                    </button>
                </div>

                <!-- Trust badges -->
                <div class="trust-badges">
                    <div class="badge">
                        <mat-icon>shield</mat-icon>
                        <span>7 Gün Ücretsiz</span>
                    </div>
                    <div class="badge">
                        <mat-icon>credit_card</mat-icon>
                        <span>Kredi Kartı Gerektirmez</span>
                    </div>
                </div>
            </div>

            <!-- Right - App Mockup -->
            <div class="mockup-container">
                <div class="mockup-card floating">
                    <div class="mockup-header">
                        <div class="progress-info">
                            <p class="label">Günlük İlerleme</p>
                            <p class="value">456 WPM</p>
                        </div>
                        <div class="badge-circle">
                            <span>+23%</span>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="progress-labels">
                            <span>Başlangıç: 200 WPM</span>
                            <span class="target">Hedef: 600 WPM</span>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div *ngFor="let stat of stats" class="stat-item">
                            <p class="stat-value">{{ stat.value }}</p>
                            <p class="stat-label">{{ stat.label }}</p>
                        </div>
                    </div>
                </div>

                <!-- Floating elements -->
                <div class="floating-badge badge-1">
                    <div class="icon-circle success">
                        <span>✓</span>
                    </div>
                    <span>Egzersiz Tamamlandı!</span>
                </div>

                <div class="floating-badge badge-2">
                    <div class="icon-circle trophy">
                        <span>🏆</span>
                    </div>
                    <span>Yeni Rozet!</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll indicator -->
    <a href="#ozellikler" class="scroll-indicator">
        <span>Keşfet</span>
        <mat-icon>keyboard_arrow_down</mat-icon>
    </a>
</section>
