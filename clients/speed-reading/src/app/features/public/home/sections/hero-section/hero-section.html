<section class="hero-section" aria-labelledby="hero-title">
  <div class="container">
    <div class="content-grid">
      <div class="text-content">
        <h1 id="hero-title" class="title">{{ content.title }}</h1>
        <p class="subtitle">{{ content.subtitle }}</p>
        <div class="cta-buttons">
          <button type="button" class="ds-btn ds-btn--large primary-btn" (click)="startFreeTrial()">{{ content.primaryActionLabel }}</button>
          <button type="button" class="ds-btn ds-btn--large secondary-btn" (click)="scrollToFeatures()">{{ content.secondaryActionLabel }}</button>
        </div>
        @if (content.trustPoints.length) {
          <ul class="trust-badges">
            @for (trustPoint of content.trustPoints; track trustPoint) { <li>{{ trustPoint }}</li> }
          </ul>
        }
      </div>

      <figure class="reading" role="img" aria-label="Okuma ekranı örneği: odak çizgisi satırda ilerliyor; hız ve anlama birlikte ölçülüyor">
        <div class="reading__head" aria-hidden="true"><strong>Bugünkü egzersiz</strong><span>Satır takibi</span></div>
        <div class="reading__lines" aria-hidden="true">
          <span></span>
          <span class="reading__current"><span class="reading__read"></span><span class="reading__focus"></span></span>
          <span></span>
          <span class="reading__short"></span>
        </div>
        <div class="reading__stats" aria-hidden="true">
          @for (stat of stats; track stat.label) {
            <span><small>{{ stat.label }}</small><strong>{{ stat.value }}</strong></span>
          }
        </div>
      </figure>
    </div>
  </div>
</section>
