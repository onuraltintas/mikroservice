<section class="hero-section">
    <!-- Background decorative elements -->
    <div class="bg-decorations">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>
    </div>

    <div class="container">
        <div class="content-grid">
            <!-- Left Content -->
            <div class="text-content">
                <h1 class="title">
                    {{ content.title }}
                </h1>

                <p class="subtitle">
                    {{ content.subtitle }}
                </p>

                <div class="cta-buttons">
                    <button mat-raised-button color="accent" class="primary-btn" (click)="startFreeTrial()">
                        {{ content.primaryActionLabel }}
                    </button>
                    <button mat-stroked-button class="secondary-btn" (click)="scrollToFeatures()">
                        {{ content.secondaryActionLabel }}
                    </button>
                </div>

                <!-- Trust badges -->
                <div class="trust-badges">
                    <div *ngFor="let trustPoint of content.trustPoints; let index = index" class="badge">
                        <mat-icon>{{ index === 0 ? 'shield' : index === 1 ? 'insights' : 'route' }}</mat-icon>
                        <span>{{ trustPoint }}</span>
                    </div>
                </div>
            </div>

            <!-- Right - App Mockup -->
            <div class="mockup-container">
                <div class="mockup-card floating">
                    <div class="mockup-header">
                        <div class="progress-info">
                            <p class="label">Kişisel çalışma</p>
                            <p class="value">Hız + anlama</p>
                        </div>
                        <div class="badge-circle">
                            <span>Plan</span>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="progress-labels">
                            <span>Başlangıç ölçümü</span>
                            <span class="target">Kişisel hedef</span>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div *ngFor="let stat of stats" class="stat-item">
                            <p class="stat-value">{{ stat.value }}</p>
                            <p class="stat-label">{{ stat.label }}</p>
                        </div>
                    </div>
                </div>

                <!-- Floating elements -->
                <div class="floating-badge badge-1">
                    <div class="icon-circle success">
                        <span>✓</span>
                    </div>
                    <span>Egzersiz Tamamlandı!</span>
                </div>

                <div class="floating-badge badge-2">
                    <div class="icon-circle trophy">
                        <span>🏆</span>
                    </div>
                    <span>Yeni Rozet!</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll indicator -->
    <a href="#ozellikler" class="scroll-indicator">
        <span>Keşfet</span>
        <mat-icon>keyboard_arrow_down</mat-icon>
    </a>
</section>
