<div class="verify-email-container">
  <mat-card class="verify-email-card">
    <mat-card-header>
      <mat-card-title>E-posta Doğrulama</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (loading) {
        <div class="loading-message">
          <mat-spinner diameter="48"></mat-spinner>
          <p>E-posta adresiniz doğrulanıyor...</p>
        </div>
      } @else if (success) {
        <div class="success-message">
          <mat-icon>check_circle</mat-icon>
          <p>E-posta adresiniz başarıyla doğrulandı!</p>
          <p>Giriş sayfasına yönlendiriliyorsunuz...</p>
          <button mat-raised-button color="primary" routerLink="/auth/login" class="full-width">
            Giriş Yap
          </button>
        </div>
      } @else if (error) {
        <div class="error-message">
          <mat-icon>error</mat-icon>
          <p>{{ error }}</p>
          <button mat-raised-button color="primary" routerLink="/auth/login" class="full-width">
            Giriş Sayfasına Dön
          </button>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
