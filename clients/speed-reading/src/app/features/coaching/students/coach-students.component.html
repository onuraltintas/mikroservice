<div class="page-container">
  <div class="page-header">
    <h2><mat-icon>people</mat-icon> Öğrencilerim</h2>
    <button mat-raised-button color="primary" (click)="load()">
      <mat-icon>refresh</mat-icon> Yenile
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="filters">
        <mat-form-field appearance="outline">
          <mat-label>Durum</mat-label>
          <mat-select [(ngModel)]="filterStatus" (selectionChange)="onFilter()">
            <mat-option *ngFor="let o of statusOptions" [value]="o.value">{{ o.label }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div *ngIf="loading()" class="loading-container"><mat-spinner diameter="40"></mat-spinner></div>
      <div *ngIf="!loading() && records.length === 0" class="empty-state">
        <mat-icon>people_outline</mat-icon>
        <p>Henüz bağlı öğrenci yok</p>
      </div>

      <table mat-table [dataSource]="records" *ngIf="!loading() && records.length > 0" class="full-width-table">
        <ng-container matColumnDef="studentId">
          <th mat-header-cell *matHeaderCellDef>Öğrenci</th>
          <td mat-cell *matCellDef="let r">
            <a [routerLink]="['/coaching/students', r.studentId]" class="student-link">
              <mat-icon class="icon-sm">person</mat-icon>
              {{ r.studentName || (r.studentId | slice:0:8) + '...' }}
            </a>
          </td>
        </ng-container>
        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef>Başlangıç</th>
          <td mat-cell *matCellDef="let r">{{ r.startDate | date:'dd.MM.yyyy' }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Durum</th>
          <td mat-cell *matCellDef="let r">
            <span class="status-badge status-{{ r.status.toLowerCase() }}">
              {{ statusLabels[r.status] }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>İşlemler</th>
          <td mat-cell *matCellDef="let r">
            <a mat-icon-button aria-label="Öğrenci detayını gör" [routerLink]="['/coaching/students', r.studentId]"
              matTooltip="Öğrenci Detayı">
              <mat-icon>open_in_new</mat-icon>
            </a>
              <button mat-icon-button type="button" color="warn" aria-label="Koçluk ilişkisini sonlandır" *ngIf="r.status === 'Active'"
              matTooltip="İlişkiyi Sonlandır" (click)="endRelationship(r)">
              <mat-icon>stop_circle</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator *ngIf="!loading() && total > 0"
        [length]="total" [pageSize]="pageSize" [pageIndex]="page - 1"
        [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons
        (page)="onPage($event)">
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
