<div class="newsletter-list-container p-6">
    <div class="header mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">E-posta Aboneleri</h1>
            <p class="text-gray-600 mt-1">Bülten aboneliklerini görüntüleyin ve yönetin</p>
        </div>
        <button mat-raised-button color="primary" (click)="exportToCsv()">
            <mat-icon class="mr-2">download</mat-icon>
            Listeyi İndir (CSV)
        </button>
    </div>

    <mat-card class="shadow-sm">
        <div class="loading-shade" *ngIf="loading()">
            <div class="spinner-container">
                <!-- Simple spinner or MatProgressSpinner if imported -->
                Yükleniyor...
            </div>
        </div>

        <div class="table-container overflow-x-auto">
            <table mat-table [dataSource]="dataSource" matSort class="w-full">

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                    <td mat-cell *matCellDef="let row" class="font-medium text-gray-700"> {{row.email}} </td>
                </ng-container>

                <!-- Source Column -->
                <ng-container matColumnDef="source">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Kaynak </th>
                    <td mat-cell *matCellDef="let row">
                        <span class="px-2 py-1 rounded bg-gray-100 text-gray-600 text-xs text-nowrap">
                            {{row.source || 'Web Sitesi'}}
                        </span>
                    </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="isActive">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Durum </th>
                    <td mat-cell *matCellDef="let row">
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                            [ngClass]="row.isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                            {{row.isActive ? 'Aktif' : 'Pasif'}}
                        </span>
                    </td>
                </ng-container>

                <!-- Created At Column -->
                <ng-container matColumnDef="createdAt">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Kayıt Tarihi </th>
                    <td mat-cell *matCellDef="let row" class="text-gray-500"> {{row.createdAt | date:'mediumDate'}}
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> İşlemler </th>
                    <td mat-cell *matCellDef="let row">
                    <button mat-icon-button type="button" color="warn" aria-label="Aboneyi sil" (click)="deleteSubscriber(row)" matTooltip="Sil">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="4" class="p-4 text-center text-gray-500">
                        Kayıt bulunamadı.
                    </td>
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Sayfa seçin"></mat-paginator>
        </div>
    </mat-card>
</div>
