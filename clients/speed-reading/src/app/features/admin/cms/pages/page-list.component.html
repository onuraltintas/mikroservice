<div class="page-list-container p-6">
    <div class="header mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Sayfa Yönetimi</h1>
            <p class="text-gray-600 mt-1">Web sitesi sayfalarını oluşturun ve düzenleyin</p>
        </div>
        <button mat-raised-button color="primary" routerLink="create">
            <mat-icon class="mr-2">add</mat-icon>
            Yeni Sayfa
        </button>
    </div>

    <mat-card class="shadow-sm">
        <div class="loading-shade" *ngIf="loading()">
            <div class="spinner-container">
                Yükleniyor...
            </div>
        </div>

        <div class="table-container overflow-x-auto">
            <table mat-table [dataSource]="dataSource" matSort class="w-full">

                <!-- Title Column -->
                <ng-container matColumnDef="title">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Başlık </th>
                    <td mat-cell *matCellDef="let row" class="font-medium text-gray-700"> {{row.title}} </td>
                </ng-container>

                <!-- Slug Column -->
                <ng-container matColumnDef="slug">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> URL Yolu </th>
                    <td mat-cell *matCellDef="let row" class="text-gray-500 text-sm"> /{{row.slug}} </td>
                </ng-container>

                <!-- Published Column -->
                <ng-container matColumnDef="isPublished">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Durum </th>
                    <td mat-cell *matCellDef="let row">
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                            [ngClass]="row.isPublished ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'">
                            {{row.isPublished ? 'Yayında' : 'Taslak'}}
                        </span>
                    </td>
                </ng-container>

                <!-- Updated At Column -->
                <ng-container matColumnDef="updatedAt">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Son Güncelleme </th>
                    <td mat-cell *matCellDef="let row" class="text-gray-500">
                        {{ (row.updatedAt || row.createdAt) | date:'mediumDate' }}
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="ui-cell--min-150"> İşlemler </th>
                    <td mat-cell *matCellDef="let row">
                        <div class="flex items-center gap-2 ui-cell--min-150">
                            <button mat-icon-button type="button" color="primary" aria-label="Sayfayı düzenle" [routerLink]="[row.id, 'edit']"
                                matTooltip="Düzenle">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button type="button" color="warn" aria-label="Sayfayı sil" (click)="deletePage(row)" matTooltip="Sil">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="5" class="p-4 text-center text-gray-500">
                        Hiç sayfa bulunamadı.
                    </td>
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[10, 25, 50]" aria-label="Sayfa seçin"></mat-paginator>
        </div>
    </mat-card>
</div>
