<div class="settings-page">
    <div class="page-header">
        <div>
            <h1>Sistem Ayarları</h1>
            <p>Kimlik servisi tarafından yönetilen, gizli olmayan yapılandırmaları düzenleyin.</p>
        </div>
        <div class="header-actions">
            <button mat-stroked-button type="button" (click)="refreshCache()" [disabled]="loading() || saving">
                <mat-icon>refresh</mat-icon>
                Önbelleği Yenile
            </button>
            <button mat-raised-button color="primary" type="button" (click)="saveSettings()"
                [disabled]="loading() || saving || configurations.length === 0">
                <mat-icon>save</mat-icon>
                {{ saving ? 'Kaydediliyor...' : 'Değişiklikleri Kaydet' }}
            </button>
        </div>
    </div>

    <mat-card *ngIf="loading()" class="loading-card">
        <mat-spinner></mat-spinner>
    </mat-card>

    <mat-card *ngIf="!loading() && configurations.length === 0" class="empty-card">
        <mat-icon>tune</mat-icon>
        <h2>Yönetilebilir ayar bulunamadı</h2>
        <p>Bu servis ortamında gizli olmayan bir sistem ayarı tanımlanmamış.</p>
    </mat-card>

    <div *ngIf="!loading() && configurations.length > 0">
        <mat-card *ngFor="let group of groups" class="settings-card">
            <h2>{{ group }}</h2>
            <div class="setting-row" *ngFor="let configuration of getSettings(group)">
                <div class="setting-description">
                    <strong>{{ configuration.key }}</strong>
                    <span>{{ configuration.description || 'Açıklama yok' }}</span>
                </div>

                <label class="boolean-setting" *ngIf="isBoolean(configuration)">
                    <input type="checkbox" [ngModel]="values[configuration.key]"
                        (ngModelChange)="updateValue(configuration, $event)">
                    <span>{{ values[configuration.key] ? 'Açık' : 'Kapalı' }}</span>
                </label>

                <mat-form-field appearance="outline" *ngIf="!isBoolean(configuration)">
                    <mat-label>Değer</mat-label>
                    <input matInput [type]="isNumber(configuration) ? 'number' : 'text'"
                        [ngModel]="values[configuration.key]"
                        (ngModelChange)="updateValue(configuration, $event)">
                </mat-form-field>
            </div>
        </mat-card>
    </div>
</div>
