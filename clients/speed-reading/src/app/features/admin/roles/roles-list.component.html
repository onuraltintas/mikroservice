<div class="roles-page">
    <div class="page-header">
        <h1>Rol Yönetimi</h1>
        <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            Yeni Rol Ekle
        </button>
    </div>

    <mat-card>
        <div class="table-container">
            <table mat-table [dataSource]="roles" class="roles-table">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Rol Adı</th>
                    <td mat-cell *matCellDef="let role">
                        <strong>{{ role.name }}</strong>
                    </td>
                </ng-container>

                <ng-container matColumnDef="normalizedName">
                    <th mat-header-cell *matHeaderCellDef>Normalized Name</th>
                    <td mat-cell *matCellDef="let role">{{ role.normalizedName }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let role">
                        <div class="actions-wrapper">
                            <button mat-icon-button [matMenuTriggerFor]="menu" class="action-btn">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="openEditDialog(role)"
                                    [disabled]="isSystemRole(role.name)">
                                    <mat-icon>edit</mat-icon>
                                    <span>Düzenle</span>
                                </button>
                                <button mat-menu-item (click)="deleteRole(role)" [disabled]="isSystemRole(role.name)"
                                    class="delete-item">
                                    <mat-icon color="warn">delete</mat-icon>
                                    <span>Sil</span>
                                </button>
                            </mat-menu>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>

        <div class="system-roles-info">
            <mat-icon>info</mat-icon>
            <span>Admin, Teacher, Student ve Editor sistem rolleridir ve silinemez.</span>
        </div>
    </mat-card>
</div>
