<h2 mat-dialog-title class="dialog-title">
    <span class="material-icons title-icon">layers</span>
    <span>{{ data.title }}</span>
    <span class="subtitle">Seviye Seçimi</span>
</h2>

<mat-dialog-content>
    <div class="age-filter">
        <label for="exercise-age-group">Yaş grubu</label>
        <select id="exercise-age-group" [value]="selectedAgeGroupId"
            (change)="selectedAgeGroupId = $any($event.target).value">
            <option value="">Tüm yaş grupları</option>
            <option *ngFor="let group of ageGroups" [value]="group.id">{{ group.name }}</option>
        </select>
    </div>
    <div class="level-list">
        <div *ngFor="let ex of filteredExercises; trackBy: trackById" class="level-item" (click)="select(ex)">
            <div class="level-info">
                <div class="level-header">
                    <span class="level-badge" [ngClass]="getDifficultyClass(ex.difficultyLevel)">
                        Seviye {{ ex.difficultyLevel }}
                    </span>
                    <span class="age-badge" *ngIf="getAgeGroupName(ex)" [ngClass]="getAgeGroupClass(ex)">
                        {{ getAgeGroupName(ex) }}
                    </span>
                    <span class="level-title">{{ ex.title }}</span>
                </div>
                <p class="level-desc" *ngIf="ex.description">
                    {{ ex.description.length > 80 ? (ex.description | slice:0:80) + '...' : ex.description }}
                </p>
            </div>
            <button class="sp-btn play-btn">
                <span class="material-icons">play_circle</span>
            </button>
        </div>
    </div>
    <p *ngIf="filteredExercises.length === 0" class="empty-state">Bu yaş grubunda kayıtlı egzersiz bulunmuyor.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button class="sp-btn" mat-dialog-close>vazgeç</button>
</mat-dialog-actions>
