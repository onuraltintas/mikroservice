<div class="profile-container">
    <div class="sp-card profile-card">
        <div class="sp-card-header">
            <div class="header-content">
                <div class="avatar-circle">
                    <span class="material-icons">person</span>
                </div>
                <div class="header-text">
                    <div class="sp-card-title">Profilim</div>
                    <div class="sp-card-subtitle">Kişisel bilgilerinizi düzenleyin</div>
                </div>
            </div>
        </div>

        <div class="sp-card-content">
            @if (loading()) {
            <div class="loading-state" role="status" aria-live="polite">
                <div class="sp-spinner"></div>
                <span class="sr-only">Profil yükleniyor</span>
            </div>
            } @else {
            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
                <div class="form-row">
                    <div class="sp-field">
                        <label for="profile-first-name">Ad</label>
                        <input id="profile-first-name" type="text" formControlName="firstName" placeholder="Adınız" autocomplete="given-name">
                        <div class="sp-error" *ngIf="profileForm.get('firstName')?.hasError('required')">
                            Ad zorunludur
                        </div>
                    </div>

                    <div class="sp-field">
                        <label for="profile-last-name">Soyad</label>
                        <input id="profile-last-name" type="text" formControlName="lastName" placeholder="Soyadınız" autocomplete="family-name">
                        <div class="sp-error" *ngIf="profileForm.get('lastName')?.hasError('required')">
                            Soyad zorunludur
                        </div>
                    </div>
                </div>

                <div class="sp-field full-width">
                    <label for="profile-email">E-posta</label>
                    <input id="profile-email" type="email" formControlName="email" placeholder="ornek@email.com" autocomplete="email">
                    <div class="sp-hint">E-posta adresi değiştirilemez</div>
                </div>

                <div class="form-row">
                    <div class="sp-field">
                        <label for="profile-phone">Telefon</label>
                        <input id="profile-phone" type="tel" formControlName="phoneNumber" placeholder="5XX XXX XX XX" autocomplete="tel">
                    </div>

                    <div class="sp-field">
                        <label for="profile-birth-date">Doğum Tarihi</label>
                        <input id="profile-birth-date" type="date" formControlName="dateOfBirth" autocomplete="bday">
                    </div>
                </div>

                <div class="actions">
                    <button class="sp-btn sp-btn-primary" type="submit" [disabled]="profileForm.invalid || saving()">
                        @if (saving()) {
                        <div class="sp-spinner sp-spinner-sm"></div>
                        Kaydediliyor...
                        } @else {
                        <span class="material-icons">save</span>
                        Değişiklikleri Kaydet
                        }
                    </button>
                </div>
            </form>
            }
        </div>
    </div>
</div>
