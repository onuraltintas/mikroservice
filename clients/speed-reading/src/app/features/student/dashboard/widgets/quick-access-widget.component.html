<!-- Quick Access Widget — Sprint 3 -->
<div class="qa-widget">
  <h3 class="qa-widget__title">Hızlı Erişim</h3>
  <div class="qa-links">
    @for (link of quickLinks; track link.route) {
      <button type="button" class="qa-link" [class]="'qa-link qa-link--' + link.tone" (click)="navigate(link)">
        <div class="qa-link__icon">
          <span class="material-icons" aria-hidden="true">{{ link.icon }}</span>
        </div>
        <span class="qa-link__label">{{ link.label }}</span>
        <span class="material-icons qa-link__arrow" aria-hidden="true">chevron_right</span>
      </button>
    }
  </div>
</div>
