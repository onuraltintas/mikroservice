server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers: in the server and again in every location with its own add_header (nginx does not inherit them).
    include /etc/nginx/snippets/security-headers.conf;

    location = /health/live {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Browsers with the old service worker check ngsw-worker.js for updates; it must always come fresh so the
    # removal worker reaches them. The manifest is revalidated too.
    location ~ ^/(?:ngsw-worker\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        # HTML documents must be revalidated so Angular can load a newly
        # deployed, content-hashed application bundle on the next visit.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
