<div class="fixed inset-0 z-[100]" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop (Static) -->
    <div class="fixed inset-0 bg-(--ui-text) backdrop-blur-sm transition-opacity" (click)="onCancel()"></div>

    <!-- Modal Position Container -->
    <div class="fixed inset-0 z-[101] overflow-y-auto">
        <div class="flex min-h-full items-start justify-center p-4 text-center sm:p-12">

            <!-- Modal Panel -->
            <div
                class="relative w-full max-w-lg transform overflow-hidden rounded-2xl bg-(--ui-surface) text-left shadow-2xl transition-all border border-(--ui-border) bg-opacity-100">

                <!-- Header -->
                <div
                    class="bg-(--ui-brand-soft) p-6 border-b border-(--ui-border)">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-4">
                            <div
                                class="flex h-10 w-10 items-center justify-center rounded-lg bg-(--ui-brand-soft) text-(--ui-brand-text)">
                                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-(--ui-text)">Yeni Rol Oluştur</h3>
                                <p class="text-sm text-(--ui-text-muted)">Sisteme yeni bir rol tanımı ekleyin.
                                </p>
                            </div>
                        </div>
                        <button (click)="onCancel()" class="text-(--ui-text-muted) hover:text-(--ui-text-muted)">
                            <span class="sr-only">Kapat</span>
                            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Body -->
                <div class="p-6 space-y-5">
                    <form [formGroup]="form" (ngSubmit)="onSubmit()">
                        <div class="space-y-4">

                            <!-- Role Name Input -->
                            <div class="group">
                                <label for="name"
                                    class="block text-sm font-medium text-(--ui-text) mb-1.5 ml-0.5">Rol
                                    Adı</label>
                                <input type="text" id="name" formControlName="name"
                                    class="block w-full rounded-lg border-(--ui-border) shadow-sm focus:border-(--ui-brand) focus:ring-(--ui-brand) sm:text-sm p-2.5 transition-colors"
                                    placeholder="Örn: Editör">
                                <p *ngIf="form.get('name')?.touched && form.get('name')?.errors?.['required']"
                                    class="mt-1 text-xs text-(--ui-danger) ml-0.5">Rol adı zorunludur.</p>
                            </div>

                            <!-- Description Input -->
                            <div class="group">
                                <label for="description"
                                    class="block text-sm font-medium text-(--ui-text) mb-1.5 ml-0.5">Açıklama</label>
                                <textarea id="description" formControlName="description" rows="3"
                                    class="block w-full rounded-lg border-(--ui-border) shadow-sm focus:border-(--ui-brand) focus:ring-(--ui-brand) sm:text-sm p-2.5 transition-colors resize-none"
                                    placeholder="Rol hakkında kısa açıklama..."></textarea>
                                <p *ngIf="form.get('description')?.touched && form.get('description')?.errors?.['required']"
                                    class="mt-1 text-xs text-(--ui-danger) ml-0.5">Açıklama zorunludur.</p>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Footer -->
                <div
                    class="bg-(--ui-surface-muted) px-6 py-4 border-t border-(--ui-border) flex justify-end gap-3">
                    <button type="button" (click)="onCancel()"
                        class="rounded-lg px-4 py-2 text-sm font-medium text-(--ui-text) bg-(--ui-surface) border border-(--ui-border) hover:bg-(--ui-surface-muted) focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-(--ui-brand) transition-colors">
                        İptal
                    </button>
                    <button type="button" (click)="onSubmit()" [disabled]="form.invalid || loading()"
                        class="rounded-lg px-4 py-2 text-sm font-medium text-(--ui-brand-contrast) bg-(--ui-brand) hover:bg-(--ui-brand) focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-(--ui-brand) disabled:opacity-50 disabled:cursor-not-allowed transition-colors inline-flex items-center">
                        <svg *ngIf="loading()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        {{ loading() ? 'Oluştur' : 'Oluştur' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
