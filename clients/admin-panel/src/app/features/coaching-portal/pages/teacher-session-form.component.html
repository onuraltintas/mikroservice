<section class="mx-auto max-w-4xl space-y-5">
  <div>
    <a routerLink="/coaching-portal/sessions" class="text-sm font-medium text-indigo-600 hover:underline">← Seanslarıma dön</a>
    <p class="mt-4 text-sm font-medium text-indigo-600 dark:text-indigo-300">Koç çalışma alanı</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight">Yeni seans planla</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Yalnızca aktif öğrencilerinle seans oluşturabilirsin.</p>
  </div>

  <div *ngIf="errorMessage()" role="alert" class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-200">{{ errorMessage() }}</div>
  <div *ngIf="isLoading()" class="h-40 animate-pulse rounded-2xl bg-slate-200 dark:bg-slate-800" aria-label="Öğrenciler yükleniyor"></div>

  <form *ngIf="!isLoading()" (ngSubmit)="submit()" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-6">
    <div class="grid gap-4 md:grid-cols-3">
      <label class="text-sm font-medium">Başlangıç
        <input [(ngModel)]="form.startTime" name="startTime" type="datetime-local" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950" />
      </label>
      <label class="text-sm font-medium">Süre (dk)
        <input [(ngModel)]="form.durationMinutes" name="durationMinutes" type="number" min="1" max="240" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950" />
      </label>
      <label class="text-sm font-medium">Seans türü
        <select [(ngModel)]="form.type" name="type" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"><option value="OneOnOne">Birebir</option><option value="Group">Grup</option><option value="Online">Online</option></select>
      </label>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <label class="text-sm font-medium">Ders / konu
        <input [(ngModel)]="form.subject" name="subject" maxlength="120" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950" />
      </label>
      <label class="text-sm font-medium">Görüşme bağlantısı (opsiyonel)
        <input [(ngModel)]="form.meetingLink" name="meetingLink" type="url" maxlength="500" placeholder="https://..." class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950" />
      </label>
    </div>
    <label class="block text-sm font-medium">Koç notu (opsiyonel)
      <textarea [(ngModel)]="form.notes" name="notes" maxlength="2000" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"></textarea>
    </label>
    <fieldset>
      <legend class="mb-2 text-sm font-semibold">Katılımcı öğrenciler</legend>
      <div class="grid max-h-72 gap-2 overflow-y-auto rounded-xl border border-slate-200 p-3 md:grid-cols-2 dark:border-slate-800">
        <label *ngFor="let student of students(); trackBy: trackByStudent" class="flex items-center gap-2 rounded-lg px-2 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-800">
          <input type="checkbox" [checked]="isSelected(student.userId)" (change)="toggleStudent(student.userId)" />
          <span>{{ student.fullName }}<span *ngIf="student.gradeLevel"> · {{ student.gradeLevel }}. sınıf</span></span>
        </label>
        <p *ngIf="students().length === 0" class="text-sm text-slate-500">Aktif öğrenciniz bulunamadı.</p>
      </div>
      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Seçili öğrenci: {{ selectedStudentIds.size }}</p>
    </fieldset>
    <div class="flex justify-end gap-3">
      <a routerLink="/coaching-portal/sessions" class="rounded-lg border border-slate-300 px-4 py-2 text-sm dark:border-slate-700">Vazgeç</a>
      <button type="submit" [disabled]="isSaving() || isLoading()" class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">{{ isSaving() ? 'Kaydediliyor…' : 'Seansı planla' }}</button>
    </div>
  </form>
</section>
