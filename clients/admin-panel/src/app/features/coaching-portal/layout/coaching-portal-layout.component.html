<div class="min-h-screen bg-[var(--ui-page)] text-[var(--ui-text)]">
  <header class="border-b border-[var(--ui-border)] bg-[var(--ui-surface)] backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
      <a routerLink="/coaching-portal" class="flex items-center gap-3" aria-label="Koçluk ana sayfası">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white">E</span>
        <span>
          <span class="block text-sm font-semibold text-slate-950 dark:text-white">Eduİvme</span>
          <span class="block text-xs text-indigo-600 dark:text-indigo-300">Öğrenci Koçluğu</span>
        </span>
      </a>

      <div class="flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-semibold">{{ user()?.firstName }} {{ user()?.lastName }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">{{ user()?.role }}</p>
        </div>
        <button type="button" (click)="logout()"
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-red-300 hover:text-red-600 dark:border-slate-700 dark:text-slate-200 dark:hover:border-red-500 dark:hover:text-red-300">
          Çıkış
        </button>
      </div>
    </div>

    <nav class="mx-auto flex max-w-7xl gap-1 overflow-x-auto px-4 pb-3 sm:px-6 lg:px-8" aria-label="Koçluk menüsü">
      <a routerLink="/coaching-portal" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Genel Bakış</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/assignments" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Ödevlerim</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/study-availability" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Çalışma saatlerim</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/study-plans" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Çalışma planlarım</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/automatic-plan" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Otomatik plan</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/exam-results" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Sınav sonuçlarım</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/progress" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">İlerlemem</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/subscription" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Abonelik ve ödeme</a>
      <a *ngIf="isStudent()" routerLink="/coaching-portal/sessions" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Seanslar</a>
      <a routerLink="/coaching-portal/notifications" routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200"
        class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Bildirimler</a>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>
</div>
